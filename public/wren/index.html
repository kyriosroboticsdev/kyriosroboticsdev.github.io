.tl-row .tx { flex: 1; min-width: 0; }
.tl-row .tx b { display: block; font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-row .tx small { display: block; font-size: 11.5px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-row.undone .tx b { text-decoration: line-through; color: var(--fg-dim); }
.tl-row .btn { padding: 3px 10px; font-size: 12px; flex: none; }
.tl-empty { padding: 18px 8px; text-align: center; color: var(--fg-dim); font-size: 12.5px; }
.tl-head .grow { flex: 1; }
/* Access: what this task's file tools may touch. */
.ac-row { display: flex; gap: 10px; align-items: center; padding: 7px 6px; border-radius: 8px; font-size: 12.5px; }
.ac-row .tx { flex: 1; min-width: 0; }
.ac-row .tx b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ac-row .tx small { display: block; color: var(--fg-dim); font-size: 11.5px; }
.ac-row .tag { flex: none; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); color: var(--fg-dim); }
.ac-row .btn { padding: 2px 10px; font-size: 12px; }
.ac-note { margin: 8px 6px 2px; font-size: 11.5px; color: var(--fg-dim); }
.ac-never { margin: 2px 6px 6px 22px; padding: 0; font-size: 12px; color: var(--fg-dim); }
.wt-pop { width: 540px; }
.wt-file { display: flex; gap: 10px; align-items: center; padding: 3px 6px; font-size: 12.5px; }
.wt-st { flex: none; width: 58px; font-size: 11px; color: var(--fg-dim); }
.wt-st.A { color: #4ade80; } .wt-st.D { color: #f87171; }
.wt-pop .tl-diff { max-height: 300px; overflow: auto; margin: 8px 6px; padding: 8px; border-radius: 6px; background: rgb(0 0 0 / .25); font: 11.5px/1.45 "Wren Mono", ui-monospace, monospace; white-space: pre; }
.wt-acts { display: flex; gap: 8px; align-items: center; padding: 6px; }
.wt-acts .grow { flex: 1; }
.pa.wt { color: var(--accent); }
.ac-add { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 6px 4px; }
.ac-add .text-in { flex: 1 1 100%; min-width: 0; }
.ac-add select { flex: none; width: auto; background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); color: var(--fg); border: 1px solid var(--stroke); border-radius: 8px; padding: 0 6px; font: inherit; font-size: 12px; }
.ac-add .btn { padding: 3px 10px; font-size: 12px; }
.ac-row .btn + .btn { margin-left: 4px; }
.auto-list { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; width: 100%; }
.auto-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; color: var(--fg-dim); }
.auto-row:hover { background: var(--hover); }
.auto-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.auto-row .tx b { font-weight: 500; color: var(--fg); }
.auto-row .tx small { font-size: 11.5px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.auto-row.off { opacity: .55; }
.auto-row .toggle { flex: none; }
.auto-row .btn { flex: none; padding: 3px 10px; font-size: 12px; }
.mcp-add { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; width: 100%; }
.mcp-add textarea.text-in { height: auto; padding: 6px 10px; font: 12px var(--mono); resize: vertical; }
.mcp-add .row { display: flex; gap: 6px; }
.mcp-trust { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-dim); }
.tl-head .btn { padding: 3px 10px; font-size: 12px; font-weight: 400; }
.tl-steps { display: flex; flex-direction: column; gap: 1px; }
.tl-step { border-radius: 8px; cursor: default; }
.tl-step.open { background: rgb(var(--card-rgb) / calc(var(--card-a) * 1.5)); }
.tl-step .tx code { font: 11.5px var(--mono); color: var(--fg-dim); font-weight: 400; }
.tl-step.error .st, .tl-step.denied .st { color: #f87171; }
.tl-step.running .st { color: var(--accent); }
.tl-step.undone .tx b { text-decoration: line-through; color: var(--fg-dim); }
.tl-tag { flex: none; font-size: 11px; color: var(--fg-faint); padding: 2px 7px; border-radius: 6px; background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); }
.tl-tag.warn { color: #fbbf24; }
.tl-user { margin: 8px 6px 2px; padding: 6px 10px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--accent) 16%, transparent); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 5.2em; overflow: hidden; }
.tl-model { margin: 2px 8px; font-size: 11px; color: var(--fg-faint); display: flex; align-items: center; gap: 5px; }
.tl-err { margin: 4px 6px; font-size: 12px; color: #f87171; display: flex; gap: 6px; align-items: center; }
.tl-detail { padding: 0 8px 10px 44px; font-size: 12px; }
/* Diffs and code need aligned columns: Geist Mono here, like the terminal (the rest of the UI stays one font). */
.tl-detail pre { margin: 4px 0 8px; padding: 8px; border-radius: 6px; background: rgb(0 0 0 / .25); font: 11.5px/1.45 "Wren Mono", ui-monospace, monospace; max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.tl-k { font-size: 11px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.tl-why { color: var(--fg-dim); margin: 2px 0 6px; }
.tl-change { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.tl-change span { flex: 1; }
.tl-change .btn { padding: 2px 9px; font-size: 11.5px; }
.tl-diff span.add { color: #4ade80; } .tl-diff span.del { color: #f87171; } .tl-diff span.hunk { color: var(--accent); }

/* Cost & token meter */
.meter { padding: 3px 8px; border-radius: 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums;
  color: var(--fg-dim); background: rgb(var(--card-rgb) / var(--card-a)); border: 1px solid var(--stroke); }
.meter:hover { color: var(--fg); }
.meter.warn { color: #fbbf24; border-color: rgb(251 191 36 / .4); }
.meter.over { color: var(--danger); border-color: rgb(255 107 107 / .45); }
.budget-bar { order: 0; height: 2px; margin: -2px 14px 4px; border-radius: 2px; background: var(--stroke); overflow: hidden; }
.budget-bar[hidden] { display: none; }
.budget-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.budget-bar.warn i { background: #fbbf24; } .budget-bar.over i { background: var(--danger); }
/* Lives outside the panel (the panel clips its contents) and is placed under the meter on open. */
.meter-pop { position: fixed; z-index: 8700; width: 270px; padding: 12px 14px; border-radius: 12px; box-shadow: var(--shadow);
  background: rgb(var(--glass-rgb) / .97); border: 1px solid var(--stroke); font-size: 12.5px; }
.meter-pop[hidden] { display: none; }
.meter-pop .row { display: flex; justify-content: space-between; padding: 2px 0; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.meter-pop .row b { color: var(--fg); font-weight: 500; }
.meter-pop hr { border: 0; border-top: 1px solid var(--stroke); margin: 8px 0; }
.meter-pop .budget { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.meter-pop .budget input { width: 80px; }
.meter-pop small { display: block; margin-top: 8px; color: var(--fg-faint); line-height: 1.4; }
.wp-send.stop { background: var(--danger); }
.usage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.usage-grid div { padding: 10px 12px; border-radius: 8px; background: rgb(var(--card-rgb) / var(--card-a)); border: 1px solid var(--stroke); }
.usage-grid b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.usage-grid small { color: var(--fg-dim); }

/* Ports & processes (top bar) */
.tb-ports { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.tb-ports:hover, .tb-ports.open { background: var(--hover); color: var(--fg); }
.tb-ports.has { color: var(--fg); }
.tb-ports .live { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
/* System stats: CPU · RAM · temperature, amber when busy or warm, red when hot. */
.tb-stats { gap: 9px; }
.tb-stats .s { display: flex; align-items: center; gap: 4px; }
.tb-stats .s small { font-size: 10.5px; font-weight: 500; color: var(--fg-faint); letter-spacing: .02em; }
.tb-stats .warn { color: #fbbf24; } .tb-stats .hot { color: #f87171; }
.ports-pop { position: fixed; top: calc(var(--bar-h) + 6px); right: 10px; z-index: 8700; width: min(460px, calc(100vw - 20px)); max-height: 70vh;
  display: flex; flex-direction: column; border-radius: 14px; box-shadow: var(--shadow); background: rgb(var(--glass-rgb) / min(.95, calc(var(--glass-alpha) + .35)));
  backdrop-filter: blur(var(--blur)) saturate(1.7); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.7); border: 1px solid var(--stroke); }
.ports-pop[hidden] { display: none; }
:root[data-solid] .ports-pop { backdrop-filter: none; background: rgb(var(--glass-rgb) / .97); }
.pp-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; font-weight: 600; }
.pp-head .grow { flex: 1; }
.pp-head label { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 12px; color: var(--fg-dim); }
.pp-list { overflow-y: auto; padding: 0 8px 10px; }
.pp-grp { margin: 8px 8px 4px; font-size: 11px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: .04em; }
.pp-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; }
.pp-row:hover { background: var(--hover); }
.pp-port { font-weight: 600; font-variant-numeric: tabular-nums; }
.pp-name { overflow: hidden; }
.pp-name b { font-weight: 500; }
.pp-name small { display: block; color: var(--fg-dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp-acts { display: flex; gap: 2px; }
.pp-acts .icon-btn { width: 26px; height: 26px; }
.pp-acts .stop:hover { color: var(--danger); }
.pp-acts .confirm { width: auto; padding: 0 8px; color: #fff; background: var(--danger); border-radius: 7px; font-size: 12px; }
.pp-empty { padding: 26px 16px; text-align: center; color: var(--fg-dim); }
/* Resources: what's using the computer, and fixes. */
#res-pop { padding-bottom: 8px; }
#res-pop > * { flex: none; } /* it scrolls as a column: rows keep their height */
.rs-sec { margin: 10px 16px 6px; font-size: 11px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; }
.rs-bar { display: flex; height: 12px; margin: 0 16px; border-radius: 6px; overflow: hidden; background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); }
.rs-bar i { display: block; height: 100%; }
.rs-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 16px 0; font-size: 11.5px; color: var(--fg-dim); }
.rs-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); }
.rs-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 56px; gap: 8px; align-items: center; padding: 5px 16px; font-size: 12.5px; }
.rs-row b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs-row span { text-align: right; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.rs-issue { display: flex; gap: 10px; align-items: flex-start; margin: 4px 10px; padding: 9px 10px; border-radius: 9px; font-size: 12.5px; background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); }
.rs-issue.warn { box-shadow: inset 3px 0 0 #fbbf24; } .rs-issue.crit { box-shadow: inset 3px 0 0 #f87171; } .rs-issue.info { box-shadow: inset 3px 0 0 var(--accent); }
.rs-issue p { flex: 1; margin: 0; }
.rs-issue .btn { flex: none; padding: 3px 10px; font-size: 12px; }
.rs-model { display: flex; align-items: center; gap: 8px; padding: 5px 16px; font-size: 12.5px; }
.rs-model b { flex: 1; font-weight: 500; }
.rs-model .btn { padding: 2px 10px; font-size: 12px; }
.tb-stats .dot-warn { width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; }
.tb-stats .dot-warn.crit { background: #f87171; }
/* Memory pressure: drop the costly effects until it eases (whatever the chosen look). */
:root[data-pressure="high"] .glass, :root[data-pressure="critical"] .glass, :root[data-pressure="high"] .win, :root[data-pressure="critical"] .win,
:root[data-pressure="high"] #wren-panel, :root[data-pressure="critical"] #wren-panel { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
:root[data-pressure="high"] *, :root[data-pressure="critical"] * { animation-duration: 0s !important; transition-duration: 0s !important; }

/* Clipboard history (top bar). Shares the dropdown look of the ports panel. */
.clip-pop .pp-list { padding-top: 2px; }
.clip-item { padding: 8px 10px; border-radius: 8px; }
.clip-item:hover { background: var(--hover); }
.clip-top { display: flex; align-items: center; gap: 8px; }
.clip-kind { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px;
  background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); color: var(--fg-dim); }
.clip-kind.secret { color: #fbbf24; }
.clip-kind.error { color: var(--danger); }
.clip-time { margin-left: auto; font-size: 11px; color: var(--fg-faint); }
.clip-text { margin-top: 4px; font-size: 12.5px; line-height: 1.4; max-height: 3.9em; overflow: hidden; white-space: pre-wrap; word-break: break-word; cursor: default; }
.clip-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--stroke); }
.clip-acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.clip-acts button { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--stroke); background: rgb(var(--card-rgb) / var(--card-a)); }
.clip-acts button:hover { background: var(--hover); }
.clip-acts button.ai { color: var(--accent); }
.clip-result { margin-top: 6px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; background: rgb(var(--card-rgb) / var(--card-a)); border: 1px solid var(--stroke); user-select: text; }
.clip-result pre { margin: 6px 0; padding: 8px; border-radius: 6px; background: rgb(0 0 0 / .22); overflow-x: auto; }
.clip-note { padding: 8px 16px 12px; font-size: 11.5px; color: var(--fg-faint); }

/* ===== App launcher (Launchpad-style) ===== */
#launcher { position: fixed; inset: 0; z-index: 8800; display: flex; flex-direction: column; align-items: center; padding: calc(var(--bar-h) + 40px) 6vw 40px;
  background: rgb(var(--glass-rgb) / .38); backdrop-filter: blur(calc(var(--blur) * 1.8)) saturate(1.5); -webkit-backdrop-filter: blur(calc(var(--blur) * 1.8)) saturate(1.5);
  opacity: 0; pointer-events: none; transition: opacity .18s; }
#launcher.open { opacity: 1; pointer-events: auto; }
:root[data-solid] #launcher { backdrop-filter: none; background: rgb(var(--glass-rgb) / .96); }
.ln-search { width: min(420px, 90vw); height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12px; flex: none;
  background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); border: 1px solid var(--stroke); color: var(--fg-dim); }
.ln-search input { flex: 1; border: 0; outline: 0; background: none; font-size: 15px; color: var(--fg); }
.ln-body { width: min(1040px, 100%); margin-top: 26px; overflow-y: auto; scrollbar-width: thin; }
.ln-sec { margin: 4px 8px 10px; font-size: 11.5px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .05em; }
.ln-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; margin-bottom: 18px; }
.ln-app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px 10px; border-radius: 14px; transition: transform .12s, background .12s; }
.ln-app:hover, .ln-app.sel { background: var(--hover); }
.ln-app.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.ln-app:active { transform: scale(.95); }
.ln-ic { width: 56px; height: 56px; display: grid; place-items: center; }
.ln-ic img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .25)); }
.ln-ic .tile { width: 52px; height: 52px; border-radius: 23%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 20px;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 3px 8px rgb(0 0 0 / .25); }
.ln-name { font-size: 12px; line-height: 1.3; text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ln-empty { text-align: center; color: var(--fg-dim); padding: 30px 0; }
/* Command bar: typing turns the grid into one list of things to do. */
.ln-hint { margin: 10px 0 0; font-size: 12px; color: var(--fg-faint); text-align: center; }
.ln-hint code { font: 11.5px var(--mono); padding: 1px 6px; border-radius: 5px; background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); color: var(--fg-dim); }
.cm-list { width: min(620px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }
.cm-sec { margin: 10px 12px 4px; font-size: 11px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: .05em; }
.cm-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border-radius: 10px; text-align: left; color: var(--fg); }
.cm-row:hover { background: var(--hover); }
.cm-row.sel { background: rgb(var(--card-rgb) / calc(var(--card-a) * 2.4)); box-shadow: inset 0 0 0 1.5px var(--accent); }
.cm-row.armed { box-shadow: inset 0 0 0 1.5px #f87171; }
.cm-ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 9px; background: rgb(var(--card-rgb) / calc(var(--card-a) * 2)); color: var(--fg-dim); overflow: hidden; }
.cm-ic img { width: 32px; height: 32px; object-fit: contain; }
.cm-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cm-tx b { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-tx small { font-size: 12px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-row.armed .cm-tx small { color: #fca5a5; }
.cm-key { flex: none; font-size: 11.5px; color: var(--fg-faint); }
.ln-empty .btn { margin: 10px 4px 0; }

/* Pairing QR code: the SVG scales to the box, whatever size the encoder made it. */
.qr-box { width: 240px; aspect-ratio: 1; border-radius: 12px; overflow: hidden; flex: none; background: #fff; }
.qr-box svg { display: block; width: 100%; height: 100%; }

/* Loading splash: same look as the boot splash, until the page is ready. */
#boot { position: fixed; inset: 0; z-index: 99500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 38px;
  background: linear-gradient(160deg, #0b1020, #0d0b1a); transition: opacity .45s ease; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot svg { width: 96px; height: 96px; color: #eef1f6; animation: bootbreathe 2.2s ease-in-out infinite; }
#boot .dots { display: flex; gap: 10px; }
#boot .dots i { width: 7px; height: 7px; border-radius: 50%; background: #7c9cff; opacity: .25; animation: bootdot 1.2s ease-in-out infinite; }
#boot .dots i:nth-child(2) { animation-delay: .15s; } #boot .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bootbreathe { 50% { opacity: .72; } }
@keyframes bootdot { 40% { opacity: 1; transform: translateY(-2px); } }

/* Reduced motion (chosen by tuning on slow machines, or by the user) */
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after {
  animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
.su-diag { display: grid; gap: 8px; text-align: left; margin: 0 auto; max-width: 540px; }
.su-diag .row { display: flex; gap: 14px; align-items: center; padding: 11px 14px; border-radius: 12px; background: rgb(255 255 255 / .07); border: 1px solid rgb(255 255 255 / .12);
  opacity: 0; animation: sufade .35s forwards; }
.su-diag .row .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: rgb(255 255 255 / .1); }
.su-diag .row .tx { flex: 1; min-width: 0; }
.su-diag .row b { font-weight: 600; font-size: 13.5px; }
.su-diag .row small { display: block; color: rgb(255 255 255 / .68); font-size: 12.5px; line-height: 1.4; margin-top: 1px; }
.su-diag .row .val { font-size: 12.5px; color: rgb(255 255 255 / .85); text-align: right; white-space: nowrap; }
.su-diag .row.warn .val { color: #fbbf24; }
.su-tier { display: inline-flex; gap: 8px; align-items: center; margin: 14px 0 0; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
  background: color-mix(in srgb, var(--accent) 22%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); opacity: 0; animation: sufade .4s forwards; }

/* ===== First-time setup ===== */
#setup { position: fixed; inset: 0; z-index: 98000; color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#setup[hidden] { display: none; }
#setup .su-wall { position: absolute; inset: -40px; filter: blur(26px) saturate(1.1); transform: scale(1.05); transition: background .6s; }
#setup .su-wall::after { content: ""; position: absolute; inset: 0; background: rgb(0 0 0 / .3); }
.su-stage { position: relative; width: min(620px, calc(100vw - 48px)); text-align: center; animation: suin .45s cubic-bezier(.2,.8,.3,1); }
@keyframes suin { from { opacity: 0; transform: translateY(14px); } }
.su-stage h1 { font-size: 30px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
.su-stage .sub { color: rgb(255 255 255 / .72); font-size: 15px; line-height: 1.5; margin: 0 auto 26px; max-width: 480px; }
/* Wren's own opening: the bird draws itself in one line, then the welcome appears. */
.su-bird { width: clamp(120px, 16vw, 190px); height: auto; overflow: visible; color: #fff; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 55%, transparent)); }
.su-bird path, .su-bird circle { fill: none; stroke: currentColor; stroke-width: .8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sudraw 2.2s cubic-bezier(.6,.05,.3,1) forwards; }
.su-bird .b2 { animation-delay: 1.5s; animation-duration: .7s; }
.su-bird .b3 { animation-delay: 1.9s; animation-duration: .5s; }
.su-bird circle { fill: currentColor; stroke: none; opacity: 0; animation: sufade .4s 2.1s forwards; }
@keyframes sudraw { to { stroke-dashoffset: 0; } }
@keyframes sufade { to { opacity: 1; } }
.su-welcome { font-family: var(--font-display); font-size: clamp(40px, 5vw, 78px); white-space: nowrap; line-height: 1.5; margin: 6px 0 0; opacity: 0; animation: sufade 1s 2.3s forwards, suin 1s 2.3s backwards; }
:root:not([data-display-font]) .su-welcome { font-weight: 250; letter-spacing: -.02em; }
.su-intro-sub { color: rgb(255 255 255 / .7); font-size: 15px; opacity: 0; animation: sufade .8s 3s forwards; }
.su-hello span { display: inline-block; animation: suwrite 2.6s ease-in-out forwards; }
@keyframes suwrite { 0% { clip-path: inset(0 100% 0 0); opacity: 1; } 45% { clip-path: inset(0 0 0 0); opacity: 1; } 85% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .su-bird path, .su-bird circle, .su-welcome, .su-intro-sub { animation: none; stroke-dashoffset: 0; opacity: 1; } }
.su-big { font-family: var(--font-display); font-size: clamp(40px, 5.6vw, 84px); line-height: 1.6; margin: 0 0 22px; }
.su-stage.wide { width: min(1000px, calc(100vw - 48px)); }
.su-hint { color: rgb(255 255 255 / .55); font-size: 13.5px; margin-top: 18px; }
.su-input { width: 100%; max-width: 360px; height: 48px; padding: 0 18px; border-radius: 14px; font-size: 17px; text-align: center; color: #fff; outline: 0;
  background: rgb(255 255 255 / .1); border: 1px solid rgb(255 255 255 / .2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.su-input:focus { border-color: var(--accent); }
.su-cards { display: grid; gap: 10px; text-align: left; margin: 0 auto; max-width: 520px; }
.su-card { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); color: #fff; width: 100%; text-align: left; }
.su-card:hover { background: rgb(255 255 255 / .13); }
.su-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.su-card .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; background: rgb(255 255 255 / .12); }
.su-card .tx { flex: 1; min-width: 0; }
.su-card b { display: block; font-weight: 600; font-size: 14.5px; }
.su-card small { display: block; color: rgb(255 255 255 / .7); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.su-card .su-input { height: 38px; font-size: 14px; text-align: left; margin-top: 8px; max-width: none; }
.su-walls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 16px 0 6px; }
.su-walls button { width: 92px; height: 58px; border-radius: 10px; border: 2px solid transparent; }
.su-walls button.on { border-color: #fff; }
.su-row { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 12px 0; }
.su-nav { position: absolute; bottom: 44px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 1; }
.su-btn { min-width: 150px; height: 44px; padding: 0 22px; border-radius: 999px; font-size: 15px; font-weight: 600; background: var(--accent); color: #fff; border: 0; }
.su-btn.ghost { background: rgb(255 255 255 / .12); }
.su-btn:disabled { opacity: .5; }
.su-dots { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; }
.su-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgb(255 255 255 / .3); }
.su-dots i.on { background: #fff; }
.su-skip { position: absolute; top: 20px; right: 24px; z-index: 1; color: rgb(255 255 255 / .55); font-size: 13px; }
.su-skip:hover { color: #fff; }
.su-qr { width: 200px; height: 200px; margin: 6px auto 10px; border-radius: 14px; overflow: hidden; background: #fff; }
.su-qr svg { width: 100%; height: 100%; display: block; }
.su-msg { min-height: 20px; font-size: 13px; color: rgb(255 255 255 / .75); margin-top: 10px; }

/* ===== Lock screen ===== */
#lock { position: fixed; inset: 0; z-index: 99000; overflow: hidden; color: #fff; user-select: none; }
#lock[hidden] { display: none; }
#lock .lk-wall { position: absolute; inset: -40px; filter: blur(22px) saturate(1.1); transform: scale(1.05); }
#lock .lk-wall::after { content: ""; position: absolute; inset: 0; background: rgb(0 0 0 / .22); }

.lk-time { font-size: clamp(64px, 11vw, 112px); font-weight: 300; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.lk-who { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-38%); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.lk-avatar { width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center; font-size: 52px; font-weight: 500;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 85%, #fff), color-mix(in srgb, var(--accent) 60%, #000)); box-shadow: 0 8px 28px rgb(0 0 0 / .35); }
.lk-name { font-size: 24px; font-weight: 600; text-shadow: 0 1px 12px rgb(0 0 0 / .35); font-family: var(--font-display); }
:root[data-display-font] .lk-name { font-size: 38px; font-weight: 400; }
.lk-form { display: flex; align-items: center; width: 340px; height: 50px; padding: 0 6px 0 20px; margin-top: 4px; border-radius: 999px;
  background: rgb(255 255 255 / .12); border: 1px solid rgb(255 255 255 / .18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.lk-form input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 17px; color: #fff; }
.lk-form input::placeholder { color: rgb(255 255 255 / .45); }
.lk-form button { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: rgb(255 255 255 / .7); }
.lk-form button:hover { background: rgb(255 255 255 / .12); color: #fff; }
.lk-form.busy { opacity: .6; }
.lk-form.shake { animation: lkshake .4s; }
@keyframes lkshake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.lk-msg { min-height: 22px; font-size: 14.5px; opacity: .8; display: flex; gap: 6px; align-items: center; text-shadow: 0 1px 8px rgb(0 0 0 / .4); }
.lk-msg.err { color: #ff9b9b; opacity: 1; }
.lk-hint { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .55; }

/* ===== Quick settings (top-right status icons) ===== */
.qs-btn { gap: 9px; height: 24px; padding: 0 8px; color: var(--fg); opacity: .9; }
.qs-btn .dim { opacity: .45; display: grid; }
.qs-bat { display: flex; align-items: center; gap: 3px; }
.batt { position: relative; width: 27px; height: 13px; border-radius: 4px; border: 1.2px solid currentColor; display: grid; place-items: center; overflow: hidden; }
.batt::after { content: ""; position: absolute; right: -4px; top: 3.5px; width: 2px; height: 4px; border-radius: 0 1px 1px 0; background: currentColor; opacity: .7; }
.batt { margin-right: 3px; overflow: visible; }
.batt i { position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; border-radius: 2px; background: currentColor; opacity: .32; }
.batt.low i { background: var(--danger); opacity: .85; }
.batt.charging i { background: var(--ok); opacity: .7; }
.batt b { position: relative; font-size: 8.5px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.qs-pop { width: min(360px, calc(100vw - 20px)); padding: 12px; gap: 10px; overflow-y: auto; }
.qs-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qs-tile { display: flex; align-items: center; gap: 2px; padding: 7px; border-radius: 12px; min-width: 0;
  background: rgb(var(--card-rgb) / calc(var(--card-a) * 1.5)); border: 1px solid var(--stroke); }
.qs-ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: rgb(var(--card-rgb) / calc(var(--card-a) * 3)); color: var(--fg-dim); transition: background .15s, color .15s; }
.qs-tile.on .qs-ic { background: var(--accent); color: #fff; }
.qs-tile.na { opacity: .55; }
.qs-tx { flex: 1; min-width: 0; text-align: left; padding: 2px 6px; display: flex; flex-direction: column; border-radius: 8px; }
.qs-tx:hover { background: var(--hover); }
.qs-tx b { font-weight: 600; font-size: 12.5px; }
.qs-tx small { color: var(--fg-dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qs-card { padding: 10px 12px; border-radius: 12px; background: rgb(var(--card-rgb) / calc(var(--card-a) * 1.5)); border: 1px solid var(--stroke); }
.qs-card > b { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.qs-slider { display: flex; align-items: center; gap: 8px; color: var(--fg-dim); }
.qs-slider input { flex: 1; width: auto; min-width: 0; }
.qs-slider button { display: grid; color: var(--fg-dim); border-radius: 6px; padding: 2px; }
.qs-slider button:hover { color: var(--fg); background: var(--hover); }
.qs-slider span { width: 36px; text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.qs-foot { display: flex; align-items: center; gap: 2px; padding: 0 2px; }
.qs-foot .grow { flex: 1; min-width: 0; font-size: 12px; color: var(--fg-dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.qs-foot .icon-btn.confirm, .qs-pbtns .btn.confirm { width: auto; padding: 0 10px; background: var(--danger); color: #fff; font-size: 12px; border-color: transparent; }
.qs-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.qs-head .grow { flex: 1; }
.qs-list { display: flex; flex-direction: column; gap: 1px; max-height: 330px; overflow-y: auto; }
.qs-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; text-align: left; width: 100%; }
.qs-row:hover { background: var(--hover); }
.qs-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qs-row small { color: var(--fg-dim); font-size: 11.5px; white-space: nowrap; }
.qs-row .btn { padding: 2px 10px; font-size: 12px; }
.qs-row.cur .nm { font-weight: 600; }
.qs-pw { display: flex; gap: 6px; padding: 2px 8px 8px 36px; }
.qs-pw input { flex: 1; min-width: 0; }
.qs-note { font-size: 12px; color: var(--fg-dim); padding: 6px 8px; }
.qs-pbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.qs-pbtns .btn { display: flex; align-items: center; gap: 6px; }
.st-page .qs-list { max-height: none; }

/* ===== Task tabs: thin folder tabs on the left edge ===== */
#tabs { position: fixed; left: 0; top: calc(var(--bar-h) + 56px); z-index: 8400; display: none; flex-direction: column; gap: 6px; max-height: calc(100vh - var(--bar-h) - 160px); overflow-y: auto; scrollbar-width: none; }
body.tabs-on #tabs { display: flex; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 26px; padding: 9px 0 8px; flex: none;
  border-radius: 0 9px 9px 0; border: 1px solid var(--stroke); border-left: 0; color: var(--fg-dim);
  background: rgb(var(--glass-rgb) / var(--glass-alpha)); backdrop-filter: blur(var(--blur)) saturate(1.7); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.7);
  transform: translateX(-3px); transition: transform .15s, width .15s, color .15s; }
.tab:hover { transform: translateX(0); color: var(--fg); }
.tab.on { width: 30px; transform: translateX(0); color: var(--fg); background: rgb(var(--glass-rgb) / min(.94, calc(var(--glass-alpha) + .25))); box-shadow: inset -2px 0 0 var(--accent); }
.tab-label { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 110px; }
.tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-faint); flex: none; }
.tab[data-state="thinking"] .tdot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.tab[data-state="approval"] .tdot { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
.tab[data-state="ready"] .tdot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.tab[data-state="error"] .tdot { background: var(--danger); }
.tab-badge { opacity: .5; display: grid; }
.tab.add { padding: 7px 0; }
:root[data-solid] .tab { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgb(var(--glass-rgb) / .97); }

#toast { position: fixed; left: 50%; top: calc(var(--bar-h) + 10px); transform: translate(-50%, -8px); padding: 7px 14px; border-radius: 999px;
  z-index: 9600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: var(--shadow); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== Ambient (desktop placement) ===== */
#ambient { display: none; position: fixed; left: 50%; top: 15vh; transform: translateX(-50%); text-align: center; z-index: 1;
  text-shadow: 0 2px 20px rgb(0 0 0 / .35); }
body[data-wren="desktop"] #ambient { display: block; }
.amb-greet { font-size: 34px; font-weight: 300; letter-spacing: -.01em; color: #fff; font-family: var(--font-display); }
:root[data-display-font] .amb-greet { font-size: 52px; font-weight: 400; letter-spacing: 0; }
.amb-status { margin-top: 6px; font-size: 14px; color: rgb(255 255 255 / .75); display: inline-flex; gap: 8px; align-items: center; }
.amb-hint { margin-top: 18px; font-size: 12px; color: rgb(255 255 255 / .5); }
kbd { font: 11px var(--font); padding: 1px 6px; border-radius: 5px; border: 1px solid rgb(255 255 255 / .3); }

/* ===== Dock ===== */
#dock {
  position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 8000;
  display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: calc(var(--radius) + 8px);
  box-shadow: 0 10px 30px rgb(0 0 0 / .25);
}
/* padding: 0 — the default button padding squeezed tiles into rectangles. */
.dock-item { position: relative; flex: none; padding: 0; width: var(--dock-size); height: var(--dock-size); transition: width .15s, height .15s, margin .15s; }
.dock-item .tile { width: 100%; height: 100%; border-radius: 23%; display: grid; place-items: center; color: #fff;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 3px 8px rgb(0 0 0 / .25); }
.dock-item .tile svg { width: 52%; height: 52%; }
.dock-item::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--fg); opacity: 0; }
.dock-item.running::after { opacity: .8; }
/* The app you're working in: a wider accent mark, like Windows' taskbar. */
.dock-item.focused::after { width: 14px; margin-left: -7px; border-radius: 2px; background: var(--accent); opacity: 1; }
.dock-item .tile.app { background: none; box-shadow: none; }
/* Glass icons (Personalization › App icons): a translucent tile with the app's
   symbol in its own color ("tint") or in plain white/black ("glass"). */
:root { --glyph-mono: #f4f6fa; }
:root[data-theme="light"] { --glyph-mono: #1d2026; }
.tile.gl { position: relative; overflow: hidden; color: var(--gcol);
  --gcol: var(--glyph-mono); --gc: var(--gc-d, var(--glyph-mono));
  background: linear-gradient(150deg, rgb(255 255 255 / .26), rgb(255 255 255 / .07) 42%, rgb(255 255 255 / .02) 70%, rgb(255 255 255 / .08)), rgb(28 31 38 / .30) !important;
  border: 1px solid rgb(255 255 255 / .16);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .22), inset 0 -1px 0 rgb(0 0 0 / .14), 0 6px 18px rgb(0 0 0 / .22) !important; }
:root[data-theme="light"] .tile.gl { --gc: var(--gc-l, var(--glyph-mono));
  background: linear-gradient(150deg, rgb(255 255 255 / .75), rgb(255 255 255 / .38) 45%, rgb(255 255 255 / .28)), rgb(240 242 247 / .35) !important;
  border-color: rgb(255 255 255 / .6); box-shadow: inset 0 1px 0 rgb(255 255 255 / .9), 0 6px 16px rgb(20 24 40 / .14) !important; }
:root[data-icons="tint"] .tile.gl { --gcol: var(--gc); }
:root[data-solid] .tile.gl { background: rgb(var(--card-rgb) / .9) !important; }
.tile.gl .glyph { position: absolute; inset: 24%; background: var(--gcol); -webkit-mask: var(--gm) center / contain no-repeat; mask: var(--gm) center / contain no-repeat; }
.tile.gl > svg { color: var(--gcol); }
.tile.gl .gl-l { font-weight: 600; color: var(--gcol); }
.dock-item .tile.gl .gl-l { font-size: calc(var(--dock-size) * .42); }
.ln-ic .tile.gl .gl-l { font-size: 22px; }
.dock-item .tile.app img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.dock-item .tile.letter { background: rgb(var(--card-rgb) / .16); font-weight: 600; font-size: calc(var(--dock-size) * .4); }
.dock-item .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); padding: 3px 9px; border-radius: 7px;
  white-space: nowrap; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .12s; }
.dock-item:hover .tip { opacity: 1; }
body.magnify .dock-item:hover { width: calc(var(--dock-size) * 1.35); height: calc(var(--dock-size) * 1.35); }
body.magnify .dock-item:hover + .dock-item, body.magnify .dock-item:has(+ .dock-item:hover) { width: calc(var(--dock-size) * 1.15); height: calc(var(--dock-size) * 1.15); }
.dock-sep { width: 1px; align-self: stretch; margin: 6px 3px; background: var(--stroke); }
#dock-orb { display: none; }
body[data-wren="dock"] #dock-orb { display: block; }
#dock-orb .tile { background: radial-gradient(circle at 35% 30%, #fff 0%, color-mix(in srgb, var(--accent) 80%, #fff) 18%, var(--accent) 55%, color-mix(in srgb, var(--accent) 50%, #000) 100%); }
body[data-state="thinking"] #dock-orb .tile { animation: orb 1.4s ease-in-out infinite; }
body[data-state="ready"] #dock-orb .tile { box-shadow: 0 0 0 2px var(--ok), 0 0 16px var(--ok); }
body[data-state="approval"] #dock-orb .tile { box-shadow: 0 0 0 2px #fbbf24, 0 0 16px #fbbf24; }
@keyframes orb { 50% { transform: scale(.9); opacity: .8; } }

/* ===== Windows (Windows 11 style) ===== */
.win { position: fixed; display: flex; flex-direction: column; border-radius: 9px; overflow: hidden; box-shadow: var(--shadow);
  background: rgb(var(--win-rgb) / calc(var(--glass-alpha) + .32)); backdrop-filter: blur(calc(var(--blur) * 1.6)) saturate(1.5);
  -webkit-backdrop-filter: blur(calc(var(--blur) * 1.6)) saturate(1.5); border: 1px solid var(--stroke);
  transition: opacity .15s, transform .15s; min-width: 420px; min-height: 280px; }
.win.min { opacity: 0; transform: translateY(40px) scale(.9); pointer-events: none; }
.win.max { border-radius: 0; }
.win:not(.focused) { box-shadow: 0 10px 30px rgb(0 0 0 / .25); }
.win-title { height: 36px; flex: none; display: flex; align-items: center; gap: 10px; padding-left: 12px; }
.win-title .name { flex: 1; font-size: 12px; }
.win:not(.focused) .win-title { color: var(--fg-dim); }
.caps { display: flex; height: 100%; }
.caps button { width: 46px; height: 100%; display: grid; place-items: center; }
.caps button:hover { background: var(--hover); }
.caps button.close:hover { background: #c42b1c; color: #fff; }
.win-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* ----- Window organizer: snapping, layouts, resizing ----- */
.win.snapping { transition: left .18s cubic-bezier(.2,.8,.3,1), top .18s cubic-bezier(.2,.8,.3,1), width .18s cubic-bezier(.2,.8,.3,1), height .18s cubic-bezier(.2,.8,.3,1), opacity .15s, transform .15s; }
.win.max, .win[data-snap="max"] { border-radius: 0; }
.rz { position: absolute; z-index: 2; }

// never turns them into a click. When no real click follows a release, make one,
// on the same element a browser would pick; two quick ones also make a dblclick.
(() => {
  let down = null, clicked = false, last = null;
  addEventListener("pointerdown", (e) => { down = e.button === 0 ? e.target : null; }, true);
  addEventListener("click", (e) => { if (e.isTrusted) clicked = true; }, true);
  addEventListener("dblclick", (e) => { if (e.isTrusted) last = null; }, true);
  addEventListener("pointerup", (e) => {
    if (e.button !== 0 || !down) return;
    let t = down; down = null; clicked = false;
    while (t && !t.contains(e.target)) t = t.parentNode;
    if (!t) return;
    const init = { bubbles: true, cancelable: true, composed: true, view: window, button: 0, clientX: e.clientX, clientY: e.clientY,
      screenX: e.screenX, screenY: e.screenY, ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, altKey: e.altKey, metaKey: e.metaKey };
    setTimeout(() => {
      if (clicked || !t.isConnected) return;
      const now = performance.now(), again = last && last.t === t && now - last.at < 450 && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 6;
      t.dispatchEvent(new MouseEvent("click", { ...init, detail: again ? 2 : 1 }));
      if (again) { last = null; t.dispatchEvent(new MouseEvent("dblclick", { ...init, detail: 2 })); }
      else last = { t, at: now, x: e.clientX, y: e.clientY };
    });
  }, true);
})();

// Each task tab is a server session with its own conversation and model.

let active = null;

const STATE_TEXT = { idle: "Wren", thinking: "Thinking…", ready: "Reply ready", approval: "Needs approval", offline: "Offline", error: "Something went wrong" };

function mkSession(info) {
  let s = SESS.get(info.id);
  if (!s) {
    s = { id: info.id, state: "idle", streaming: false, typing: null, el: el(`<div class="wp-log"></div>`), autoTitle: /^Task \d+$/.test(info.title) };
    SESS.set(info.id, s);
  }
  const wasRunning = s.project?.run?.status === "running";
  Object.assign(s, { title: info.title, backend: info.backend, route: info.route || null, worktree: info.worktree || null, label: info.label, local: info.local, usage: info.usage, budget: info.budget_usd ?? null, project: info.project || null });
  s.controlUntil = info.control ? Date.now() + info.control * 1000 : 0;
  if (wasRunning && s.project?.run && s.project.run.status !== "running") runFinished(s, s.project.run);
  // A task can be running from before this page loaded.
  s.remoteBusy = info.busy && !s.streaming;
  if (info.busy && s.state === "idle") s.state = "thinking";
  if (!info.busy && s.state === "thinking" && !s.streaming) s.state = "idle";
  return s;
}
function setSessState(s, st) { s.state = st; renderTabs(); updateStatus(); }

function updateStatus() {
  const all = [...SESS.values()];
  const needs = all.find((s) => s.state === "approval");
  const running = all.filter((s) => s.state === "thinking");
  const ready = all.find((s) => s.state === "ready");
  let st = "idle", text = "Wren";
  const ctl = typeof controlling === "function" ? controlling() : [];
  if (!W.online) [st, text] = ["offline", STATE_TEXT.offline];
  else if (ctl.length) [st, text] = ["control", "Using the computer · Stop"];
  else if (needs) [st, text] = ["approval", `Needs approval · ${needs.title}`];
  else if (running.length > 1) [st, text] = ["thinking", `${running.length} tasks running`];
  else if (running.length) [st, text] = ["thinking", STATE_TEXT.thinking];
  else if (ready) [st, text] = ["ready", `Reply ready · ${ready.title}`];
  else if (all.some((s) => s.state === "error")) [st, text] = ["error", STATE_TEXT.error];
  document.body.dataset.state = st;
  $("#island-text").textContent = text;
  $("#amb-status").textContent = st === "idle" ? `Wren is ready · ${cur()?.label || "…"}` : text;
  renderBadge();
  renderMeter();
  const c = cur(), busy = c && (c.state === "thinking" || c.state === "approval");
  const send = $("#wp-send");
  send.disabled = !c;
  send.classList.toggle("stop", !!busy);

  send.innerHTML = icon(busy ? "stop" : "send", 16, 2.2);
}
const fmtTok = (n) => (n < 1000 ? `${n}` : n < 1e6 ? `${(n / 1000).toFixed(n < 10000 ? 1 : 0)}k` : `${(n / 1e6).toFixed(1)}M`);
const fmtUsd = (c) => (c === 0 ? "$0.00" : c < 0.01 ? `$${c.toFixed(4)}` : `$${c.toFixed(2)}`);

const fmtDur = (ms) => (ms < 60000 ? `${Math.round(ms / 1000)} s` : `${(ms / 60000).toFixed(ms < 600000 ? 1 : 0)} min`);

function costText(u) {

  if (u.free && !u.cost_usd) return `Free · ${fmtTok(u.tokens)} tok${local}`;
  if (!u.priced && !u.cost_usd) return `${fmtTok(u.tokens)} tok${local}`;
  return `${u.priced ? "" : "≥"}${u.cost_estimated > 0 ? "≈" : ""}${fmtUsd(u.cost_usd)} · ${fmtTok(u.tokens)} tok${local}`;

async function syncSessions() {
  try {
    const [b, list] = await Promise.all([api("/backends"), api("/sessions")]);
    W.online = true;
    W.backends = b.available;
    const sel = $("#model"), keep = sel.value;
    sel.innerHTML = `<optgroup label="Auto: Wren picks per message">${AUTO.map(([p, n]) => `<option value="auto:${p}">Auto · ${n}</option>`).join("")}</optgroup>` +
      `<optgroup label="This model">${b.available.map((a) => `<option value="${esc(a.name)}">${esc(a.name)} (${esc(a.kind)})</option>`).join("")}</optgroup>`;
    sel.value = keep;
    const ids = new Set(list.sessions.map((x) => x.id));
    list.sessions.forEach((info) => { const s = mkSession(info); mirror(s, info); });
    for (const id of [...SESS.keys()]) if (!ids.has(id)) SESS.delete(id);
    if (!SESS.has(active)) activate(SESS.keys().next().value);

/* ================= Mirroring ================= */
// The service keeps each task's transcript, so a reloaded desktop gets its
// conversations back, and chats started from a paired phone show up here live.
function renderLogEntry(s, e) {
  s.textEls = s.textEls || new Map();
  if (e.type === "user") addLine(s, "msg user", esc(e.text));
  else if (e.type === "text") {
    const d = s.textEls.get(e.id);
    if (d) { d.innerHTML = md(e.text); if (s.id === active) s.el.scrollTop = s.el.scrollHeight; }
    else s.textEls.set(e.id, addLine(s, "msg wren", md(e.text)));
  } else renderEvent(s, e);
}
async function mirror(s, info) {
  if (s.streaming || s.mirroring || (s.logSeq ?? -1) >= info.log_seq) return syncApprovals(s, info);
  s.mirroring = true;
  try {
    const r = await api(`/sessions/${s.id}/log?since=${s.logSeq || 0}`);
    if (!s.streaming) { r.entries.forEach((e) => renderLogEntry(s, e)); s.logSeq = r.seq; }
  } catch {}
  s.mirroring = false;
  syncApprovals(s, info);
}
// Approvals asked while the chat runs elsewhere (a phone) appear here too, and
// cards answered elsewhere stop waiting.
function syncApprovals(s, info) {
  const pending = info.pending || [];
  if (!s.streaming) for (const a of pending) renderApproval(s, a);
  for (const card of s.el.querySelectorAll(".approve[data-id]")) {
    if (!pending.some((a) => a.id === card.dataset.id) && card.querySelector(".ap-btns button")) {
      $(".ap-btns", card).innerHTML = `<span class="ap-done">Answered</span>`;
    }
  }
  if (!pending.length && s.state === "approval" && !s.streaming) setSessState(s, info.busy ? "thinking" : "idle");
}
// Faster while a task runs somewhere else.
setInterval(async () => {
  for (const s of SESS.values()) {
    if (s.streaming || !(s.remoteBusy || s.state === "approval")) continue;
    try { const info = await api(`/sessions/${s.id}`); mkSession(info); await mirror(s, info); } catch {}
  }
  renderTabs(); updateStatus();
}, 1500);

    const was = s.project.run?.status;

  send(`The \`${r.label}\` script (\`${r.command}\`) failed${r.exit_code != null ? ` with exit code ${r.exit_code}` : ""}. End of its output:\n\`\`\`\n${tail}\n\`\`\`\nFind the cause and fix it.`);

  $("#proj-name").title = `${p.root}\nClick for project options`;

    ? `${icon("branch", 13, 2)}<span>${esc(g.branch)}</span>${g.ahead ? `<span title="Commits to push">↑${g.ahead}</span>` : ""}${g.behind ? `<span title="Commits to pull">↓${g.behind}</span>` : ""}${g.changed ? `<span class="dirty" title="Changed files">● ${g.changed}</span>` : ""}`
    : "";
  $("#proj-git").title = g?.last_commit ? `Last commit: ${g.last_commit}` : "";
  $("#proj-stack").innerHTML = p.stack.slice(0, 3).map((x) => `<span class="pill">${esc(x)}</span>`).join("");
  // Buttons for the first build, test and run script; everything else is under "more".
  const run = p.run;
  const prim = ["build", "test", "run"].map((k) => p.actions.find((a) => a.kind === k)).filter(Boolean);
  $("#proj-acts").innerHTML = prim.map((a) => {
    const st = run && run.action === a.id ? run.status : "";
    const tip = st === "running" ? `Stop ${a.command}` : a.command;
    return `<button class="pa" data-id="${esc(a.id)}" data-st="${st}" title="${esc(tip)}">${st === "running" ? '<span class="spin"></span>' : icon(PA_IC[a.kind], 13, 2)}<span>${esc(a.label)}</span></button>`;
  }).join("") + (c.worktree ? `<button class="pa wt" data-wt="review" title="See what this task changed on ${esc(c.worktree.branch)}, and merge it into ${esc(c.worktree.base)}">${icon("branch", 13, 2)}<span>Review &amp; merge</span></button>` : "") +
    `<button class="pa more" data-more="1" title="More scripts and project options">${icon("dots", 15, 2)}</button>`;
  renderRunOut();
}

/* ---------- parallel tasks: own worktree and branch ---------- */
async function parallelTask(s) {
  try {
    const info = await api(`/sessions/${s.id}/parallel`, {});
    const t = mkSession(info); activate(info.id); openWren();
    addLine(t, "tool ok", `Working on its own branch <b>${esc(info.worktree.branch)}</b> (from ${esc(info.worktree.base)}), in a separate copy of the project. Nothing reaches ${esc(info.worktree.base)} until you merge it.`);
    renderTabs();
  } catch (e) { toast(e.message); }
}
async function openWorktree() {
  const c = cur(), pop = $("#wt-pop");
  if (!c?.worktree) return;
  const r = $("#proj-acts").getBoundingClientRect();
  pop.hidden = false;
  pop.style.top = r.bottom + 8 + "px";
  pop.style.left = Math.max(8, Math.min(innerWidth - 548, r.right - 540)) + "px";
  pop.innerHTML = `<div class="tl-empty">Comparing with ${esc(c.worktree.base)}…</div>`;
  let rv;
  try { rv = await api(`/sessions/${c.id}/worktree/review`); } catch (e) { pop.innerHTML = `<div class="tl-empty">${esc(e.message)}</div>`; return; }
  const st = { A: "added", M: "changed", D: "deleted" };
  pop.innerHTML = `<div class="tl-head">${esc(c.worktree.branch)} <small>→ ${esc(c.worktree.base)} · ${rv.files.length} file${rv.files.length === 1 ? "" : "s"}</small></div>` +
    (rv.conflicts.length ? `<div class="rs-issue crit"><p>Would conflict with ${esc(c.worktree.base)} in ${rv.conflicts.map(esc).join(", ")}. Ask the task to bring in the latest ${esc(c.worktree.base)} and fix those, then review again.</p></div>` :
      rv.base_moved && rv.files.length ? `<div class="rs-issue info"><p>${esc(c.worktree.base)} moved on since this task started, but it still merges cleanly.</p></div>` : "") +
    (rv.files.length ? rv.files.map((f) => `<div class="wt-file"><span class="wt-st ${f.status}">${esc(st[f.status] || f.status)}</span><span>${esc(f.path)}</span></div>`).join("") + patchHTML(rv.patch)
      : `<div class="tl-empty">No changes yet.</div>`) +
    `<div class="wt-acts"><button class="btn danger" data-wt="discard">Discard</button><span class="grow"></span>
      <button class="btn primary" data-wt="merge" ${rv.conflicts.length || !rv.files.length ? "disabled" : ""}>Merge into ${esc(c.worktree.base)}</button></div>`;
}
$("#wt-pop").onclick = async (e) => {
  e.stopPropagation();
  const b = e.target.closest("[data-wt]"), c = cur();
  if (!b || !c) return;
  if (b.dataset.wt === "discard") {
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Discard all its work?"; return; }
    try { await api(`/sessions/${c.id}/worktree/discard`, {}); toast(`Discarded ${c.worktree.branch}`); $("#wt-pop").hidden = true; SESS.delete(c.id); activate(SESS.keys().next().value); renderTabs(); } catch (er) { toast(er.message); }
    return;
  }
  if (b.dataset.wt === "merge") {
    b.disabled = true; b.textContent = "Merging…";
    try { const r = await api(`/sessions/${c.id}/worktree/merge`, {}); toast(r.message); addLine(c, "tool ok", esc(r.message)); $("#wt-pop").hidden = true; }
    catch (er) { toast(er.message); openWorktree(); }
  }
};
function renderRunOut() {
  const c = cur(), run = c?.project?.run, out = $("#proj-out");
  if (!run || c.runHidden === run.started) { out.hidden = true; return; }
  out.hidden = false;
  out.dataset.st = run.status;
  const secs = ((run.ended || Date.now()) - run.started) / 1000;
  const what = { running: `running · ${fmtSecs(secs)}`, passed: `passed · ${fmtSecs(secs)}`, stopped: "stopped",
    failed: `failed${run.exit_code != null ? " · exit " + run.exit_code : ""} · ${fmtSecs(secs)}` }[run.status];
  $(".po-head", out).innerHTML = `<span class="po-st"></span><b>${esc(run.label)}</b><span>${what}</span><span class="grow"></span>
    ${run.status === "failed" ? `<button class="btn fix" data-a="fix">${icon("wren", 13, 2)}Ask Wren to fix</button>` : ""}
    ${run.status === "running" ? `<button class="btn" data-a="stop">Stop</button>` : `<button class="btn" data-a="again">Run again</button>`}
    <button class="icon-btn" data-a="min" title="Show or hide output">${icon("chev", 14, 2)}</button><button class="icon-btn" data-a="hide" title="Dismiss">${icon("x", 13)}</button>`;
  const pre = $("pre", out), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
  if (c.runText === undefined) fetchRun(c).then(renderRunOut);
  else if (pre.textContent !== c.runText) { pre.textContent = c.runText; if (atEnd) pre.scrollTop = pre.scrollHeight; }
  // Follow a running script while its panel is open.
  if (run.status === "running" && W.open && !projPoll) {
    projPoll = setInterval(async () => {
      const s = cur();
      if (!s?.project?.run || s.project.run.status !== "running" || !W.open) { clearInterval(projPoll); projPoll = null; return; }
      await fetchRun(s);
      if (s === cur()) renderProject();
    }, 800);
  }
}
function projMenu(s, x, y) {
  const p = s.project;
  const prim = new Set(["build", "test", "run"].map((k) => p.actions.find((a) => a.kind === k)?.id));
  const rest = p.actions.filter((a) => !prim.has(a.id)).map((a) => ({ label: `${a.label}  ·  ${a.command}`, ic: icon(PA_IC[a.kind], 15, 2), run: () => runScript(s, a.id) }));
  openCtx(x, y, [
    ...rest, ...(rest.length ? ["-"] : []),
    { label: "Show in File Explorer", ic: icon("folder", 15), run: () => openFiles(p.root) },
    { label: "Open terminal here", ic: icon("term", 15), run: () => openTerminal(p.root) },
    { label: "Refresh (git, scripts)", ic: icon("refresh", 15), run: () => refreshProject(s) },
    { label: "Copy path", ic: icon("copy", 15), run: () => navigator.clipboard?.writeText(p.root).catch(() => {}) },
    "-",
    { label: "Change project…", ic: icon("open", 15), run: () => openProjPick(s) },
    { label: "Close project", ic: icon("x", 15), run: () => setProject(s, null) },
  ]);
}
$("#proj-acts").onclick = (e) => {
  const b = e.target.closest("button"), c = cur();
  if (!b || !c?.project) return;
  if (b.dataset.more) { e.stopPropagation(); const r = b.getBoundingClientRect(); return projMenu(c, r.left, r.bottom + 4); }
  if (b.dataset.wt === "review") { e.stopPropagation(); return $("#wt-pop").hidden ? openWorktree() : ($("#wt-pop").hidden = true); }
  const run = c.project.run;
  if (run?.status === "running" && run.action === b.dataset.id) stopRun(c);
  else runScript(c, b.dataset.id);
};
$("#proj-name").onclick = (e) => { e.stopPropagation(); const c = cur(), r = e.currentTarget.getBoundingClientRect(); if (c?.project) projMenu(c, r.left, r.bottom + 4); };
$("#proj-out").onclick = (e) => {
  const a = e.target.closest("[data-a]")?.dataset.a, c = cur(), run = c?.project?.run;
  if (!a || !run) return;
  if (a === "fix") askFix(c);
  else if (a === "stop") stopRun(c);
  else if (a === "again") runScript(c, run.action);
  else if (a === "min") $("#proj-out").classList.toggle("min");
  else if (a === "hide") { c.runHidden = run.started; renderRunOut(); }
};

// Picker for a new project tab (or a new project for an existing tab).

  const pop = $("#proj-pick");

  pop.innerHTML = `<div class="pp-head"><span class="grow">${target ? `Project for “${esc(target.title)}”` : "Open a project"}</span><button class="icon-btn" data-a="close" title="Close">${icon("x", 14)}</button></div>

$("#proj-pick").onclick = (e) => {

function pickProject(path) {

}
function closeProjPick() { $("#proj-pick").hidden = true; }
function addMenu(b) {

/* ================= Quick settings ================= */
// Wi-Fi, Bluetooth, brightness, volume, battery and power, from the service
// (NetworkManager, BlueZ, PipeWire... on Linux). The top-bar popover and the
// Settings pages share these renderers and one click handler.
const IS_WIN = /Windows/.test(navigator.userAgent);
const QS = { st: null, view: "main", nets: null, devs: null, scanning: false, pw: null, confirm: null, note: "", dragging: false };
const QS_PAGES = ["network", "bluetooth", "display", "power"];
P.wifiOff = P.wifi + '<path d="M3.5 3.5l17 17"/>';

function batterySvg(b, s = 18) {
  const w = Math.max(1.5, (b.percent / 100) * 13).toFixed(1);
  const low = b.percent <= 15 && !b.plugged;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="18" height="10" rx="2.5"/><path d="M22 11v2"/><rect x="4.5" y="9.5" width="${w}" height="5" rx="1" fill="${low ? "var(--danger)" : "currentColor"}" stroke="none"/></svg>`;
}
const batText = (b) => `${b.percent}%${b.charging ? " · charging" : b.plugged ? " · plugged in" : b.minutes_left != null ? ` · ${Math.floor(b.minutes_left / 60)}h ${String(b.minutes_left % 60).padStart(2, "0")}m left` : ""}`;
const wifiSub = (w) => (!w ? "No adapter" : !w.enabled ? "Off" : w.ssid || "Not connected");
const btSub = (b) => (!b ? (IS_WIN ? "Windows Settings" : "No adapter") : !b.powered ? "Off" : b.connected.length ? b.connected.join(", ") : "On");
const modeName = (m) => ({ "power-saver": "Power saver", balanced: "Balanced", performance: "Performance" }[m] || m);

async function refreshQS(full) {
  try { QS.st = await api(`/settings/status${full ? "?full=true" : ""}`); } catch { return; }
  renderTbQS();
  // Not while the user is dragging a slider or typing a Wi-Fi password.
  if (!QS.dragging && !document.activeElement?.matches?.("input.text-in")) {
    if (!$("#qs-pop").hidden) renderQS();
    if (QS_PAGES.includes(settingsPage)) renderSettingsIfOpen();
  }
}
// Status checks: less often on Light (each one starts processes on the service).
let qsTicks = 0;
setInterval(() => { if (!document.hidden && ++qsTicks % (S.perf === "light" ? 3 : 1) === 0) refreshQS(false); }, 20000);

function renderTbQS() {
  const s = QS.st, b = $("#tb-qs");
  if (!s) { b.innerHTML = icon("wifi", 15) + icon("vol", 15) + icon("battery", 17); return; }
  let h = "";
  if (s.wifi) h += `<span class="${s.wifi.ssid ? "" : "dim"}" style="display:grid">${icon(s.wifi.enabled ? "wifi" : "wifiOff", 15)}</span>`;
  if (s.bluetooth?.connected.length) h += icon("bt", 14);
  if (s.sound) h += icon(s.sound.muted || s.sound.volume === 0 ? "volMute" : "vol", 15);
  if (s.battery) {
    const b = s.battery, cls = b.charging ? "charging" : b.percent <= 15 && !b.plugged ? "low" : "";
    h += `<span class="qs-bat"><span class="batt ${cls}"><i style="width:calc(${b.percent}% - 3px)"></i><b>${b.percent}</b></span>${b.charging ? icon("bolt", 11, 2) : ""}</span>`;
  }
  b.innerHTML = h || icon("gear", 15);
  b.title = [s.wifi && `Wi-Fi: ${wifiSub(s.wifi)}`, s.sound && `Volume: ${s.sound.muted ? "muted" : s.sound.volume + "%"}`, s.battery && `Battery: ${batText(s.battery)}`].filter(Boolean).join("\n");
}

const qsTile = (k, on, na, ic, title, sub, toggleTip) => `<div class="qs-tile ${on ? "on" : ""} ${na ? "na" : ""}">
  <button class="qs-ic" data-a="${k}-toggle" title="${esc(toggleTip)}">${icon(ic, 16, 2)}</button>
  <button class="qs-tx" data-a="${k}-open"><b>${esc(title)}</b><small>${esc(sub)}</small></button></div>`;
function qsSliders(s) {
  let h = "";
  if (s.brightness != null) h += `<div class="qs-card"><b>Display</b><div class="qs-slider">${icon("sun", 16)}<input type="range" min="5" max="100" value="${s.brightness}" data-s="brightness"><span>${s.brightness}%</span></div></div>`;
  if (s.sound) h += `<div class="qs-card"><b>Sound</b><div class="qs-slider"><button data-a="mute" title="${s.sound.muted ? "Unmute" : "Mute"}">${icon(s.sound.muted ? "volMute" : "vol", 16)}</button><input type="range" min="0" max="100" value="${s.sound.volume}" data-s="volume"><span>${s.sound.muted ? "Muted" : s.sound.volume + "%"}</span></div></div>`;
  return h;
}
function qsPowerButtons(cls) {
  const b = (p, ic, label) => QS.confirm === p
    ? `<button class="${cls} confirm" data-a="power" data-p="${p}">${label}?</button>`
    : `<button class="${cls}" data-a="power" data-p="${p}" title="${label}">${icon(ic, 16)}${cls === "btn" ? `<span>${label}</span>` : ""}</button>`;
  return b("lock", "lock", "Lock") + b("sleep", "moon", "Sleep") + b("restart", "refresh", "Restart") + b("shutdown", "power", "Shut down");
}
function qsMainHTML() {
  const s = QS.st;
  if (!s) return `<div class="qs-note">Loading…</div>`;
  const modes = s.power_profiles.length > 1;
  return `<div class="qs-tiles">
      ${qsTile("wifi", s.wifi?.enabled, !s.wifi, s.wifi?.enabled ? "wifi" : "wifiOff", "Wi-Fi", wifiSub(s.wifi), s.wifi?.can_toggle ? "Turn Wi-Fi on or off" : "Wi-Fi settings")}
      ${qsTile("bt", s.bluetooth?.powered, !s.bluetooth && !IS_WIN, "bt", "Bluetooth", btSub(s.bluetooth), "Turn Bluetooth on or off")}
      ${qsTile("mode", s.power_profile && s.power_profile !== "balanced" && s.power_profile !== "Balanced", !modes, "gauge", "Power mode", s.power_profile ? modeName(s.power_profile) : "Not available", modes ? "Switch power mode" : "")}
      ${qsTile("settings", false, false, "gear", "Settings", "All settings", "Open Settings")}
    </div>
    ${qsSliders(s)}
    ${QS.note ? `<div class="qs-note">${esc(QS.note)}</div>` : ""}
    <div class="qs-foot"><span class="grow">${s.battery ? batterySvg(s.battery, 16) + esc(batText(s.battery)) : ""}</span>${qsPowerButtons("icon-btn")}</div>`;
}
function qsWifiList() {
  const s = QS.st, w = s?.wifi;
  if (!w) return `<div class="qs-note">No Wi-Fi adapter found.</div>`;
  if (!w.enabled) return `<div class="qs-note">Wi-Fi is off.</div>`;

  if (!QS.nets.length) return `<div class="qs-note">No networks found.</div>`;
  return QS.nets.map((n) => `<button class="qs-row ${n.in_use ? "cur" : ""}" data-a="net" data-ssid="${esc(n.ssid)}">
      <span style="display:grid;opacity:${(0.35 + (n.signal / 100) * 0.65).toFixed(2)}">${icon("wifi", 16)}</span><span class="nm">${esc(n.ssid)}</span>
      ${n.secure ? icon("lock", 13) : ""}<small>${n.in_use ? "Connected" : n.known ? "Saved" : ""}</small></button>
      ${QS.pw === n.ssid ? `<form class="qs-pw" data-ssid="${esc(n.ssid)}"><input class="text-in" type="password" placeholder="Password for ${esc(n.ssid)}" autocomplete="off"><button class="btn primary">Join</button></form>` : ""}`).join("");
}
function qsBtList() {
  const s = QS.st, b = s?.bluetooth;
  if (!b) return `<div class="qs-note">${IS_WIN ? "Windows manages Bluetooth on this computer." : "No Bluetooth adapter found."}</div>`;
  if (!b.powered) return `<div class="qs-note">Bluetooth is off.</div>`;
  const list = QS.devs || [];
  const rows = list.map((d) => `<div class="qs-row ${d.connected ? "cur" : ""}">${icon("bt", 15)}<span class="nm">${esc(d.name)}</span>
      <small>${d.connected ? "Connected" : d.paired ? "Paired" : ""}</small>
      <button class="btn" data-a="dev" data-addr="${esc(d.address)}" data-do="${d.connected ? "disconnect" : d.paired ? "connect" : "pair"}">${d.connected ? "Disconnect" : d.paired ? "Connect" : "Pair"}</button></div>`).join("");
  return (rows || `<div class="qs-note">${QS.devs ? "No devices yet. Put a device in pairing mode, then scan." : "Loading…"}</div>`);
}
function qsDetailHTML(kind) {
  const s = QS.st, on = kind === "wifi" ? s?.wifi?.enabled : s?.bluetooth?.powered;
  const canToggle = kind === "wifi" ? s?.wifi?.can_toggle : !!s?.bluetooth;

      ${canToggle ? `<button class="toggle ${on ? "on" : ""}" data-a="${kind}-toggle" role="switch" aria-checked="${!!on}"></button>` : ""}</div>
    <div class="qs-list">${kind === "wifi" ? qsWifiList() : qsBtList()}</div>
    ${QS.note ? `<div class="qs-note">${esc(QS.note)}</div>` : ""}
    <div class="qs-foot"><span class="grow"></span>
      ${kind === "wifi" ? `<button class="btn" data-a="rescan">Scan again</button>` : on ? `<button class="btn" data-a="scan" ${QS.scanning ? "disabled" : ""}>${QS.scanning ? "Scanning…" : "Scan for devices"}</button>` : ""}
      ${IS_WIN ? `<button class="btn" data-a="open-sys" data-page="${kind === "wifi" ? "wifi" : "bluetooth"}">Windows settings</button>` : `<button class="btn" data-a="settings" data-page="${kind === "wifi" ? "network" : "bluetooth"}">Settings…</button>`}</div>`;
}
function renderQS() {
  const pop = $("#qs-pop");

function openQS() {

  renderQS(); refreshQS(true);
}

async function loadNets(rescan) {
  try { QS.nets = await api(`/settings/wifi${rescan ? "?rescan=true" : ""}`); } catch (e) { QS.nets = []; QS.note = e.message; }
  rerenderQS();
}
async function loadDevs(scan) {
  if (scan) { QS.scanning = true; rerenderQS(); }
  try { QS.devs = await api(`/settings/bluetooth${scan ? "?scan=true" : ""}`); } catch (e) { QS.devs = []; QS.note = e.message; }

}
async function qsDo(path, body, note) {

// Sliders send at most one request at a time and always end on the last value.
function sliderSender(path, key) {
  let busy = false, pending = null;
  return async (v) => {
    pending = v;
    if (busy) return;
    busy = true;
    while (pending != null) {
      const x = pending; pending = null;
      try { await api(path, { [key]: x }); } catch (e) { toast(e.message); pending = null; }
    }
    busy = false;
  };
}

// A real shell per tab (the service runs it in a pseudo-terminal). The shell

const TERM = { tabs: [], active: null, seq: 0, loaded: null };

    <div class="term-views"></div>

async function storeClick(win, e) {

    STORE.jobs[a.id] = { status: "running", action, progress: null, line: "Starting…" };

async function pollJobs(win) {
  let r;
  try { r = await api("/store/jobs"); } catch { return; }
  let running = false;
  for (const j of r.jobs) {
    const was = STORE.jobs[j.id]?.status;
    STORE.jobs[j.id] = j;
    if (j.status === "running") running = true;
    if (was === "running" && j.status !== "running") {
      toast(j.status === "done" ? `${j.name}: ${{ install: "installed", uninstall: "removed", update: "updated" }[j.action]}` : `${j.name}: ${j.error || "failed"}`);
      setTimeout(() => { loadInstalled(win, true); loadApps(); }, 800);
      if (STORE.queue) nextInQueue(win);
    }

  if (!running) { clearInterval(STORE.poll); STORE.poll = null; }
  renderStore(win);
}

/* ================= Tuning for this computer ================= */
// Checks the hardware (the service's profile, plus whether this page's graphics are
// accelerated) and picks settings to match: Light for old or GPU-less machines,
// Balanced, or Full. Runs in setup; Settings › Personalization can run it again.
const TUNE = { plan: null };
function graphicsInfo() {
  try {
    const gl = document.createElement("canvas").getContext("webgl");
    if (!gl) return { accel: false, renderer: "no WebGL" };
    const ext = gl.getExtension("WEBGL_debug_renderer_info");
    const renderer = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    return { accel: !/swiftshader|llvmpipe|softpipe|software|basic render|microsoft basic/i.test(renderer), renderer };
  } catch { return { accel: false, renderer: "unknown" }; }
}
const TIERS = {
  light: { name: "Light", solid: true, blur: 0, motion: "reduced", termScroll: 1500, why: "No glass blur or extra animation, slower status checks: smooth on older hardware." },
  balanced: { name: "Balanced", solid: false, blur: 16, motion: "full", termScroll: 3000, why: "Glass effects with a lighter blur, normal animation." },
  full: { name: "Full", solid: false, blur: 24, motion: "full", termScroll: 8000, why: "Every effect on: this computer has room to spare." },
};
let tunedPlan = null; // the last check from Settings, shown until the page closes
async function diagnose() {
  const p = await api("/system/profile"), g = graphicsInfo();
  const accel = p.gpu_accel === false ? false : g.accel;
  const ram = p.ram_gb, cores = p.cpu.cores;
  const tier = ram < 3.5 || cores <= 2 || !accel ? "light" : ram < 12 || cores < 6 ? "balanced" : "full";
  const rec = ram >= 24 ? "qwen2.5:14b" : ram >= 14 ? "qwen2.5:7b" : ram >= 6 ? "qwen2.5:3b" : null;
  const om = p.ollama || {}, have = (om.models || []).map((m) => m.name);
  let ai, prefer;
  if (!rec) { ai = `${ram} GB is too little for a local model. Use a cloud model, or a stronger computer on your network.`; prefer = "cloud"; }
  else if (!om.reachable) { ai = `Ollama isn't running. For private AI here, install it and get ${rec}.`; prefer = "cloud"; }
  else if (have.some((n) => n.startsWith(rec.split(":")[0]))) { ai = `Ollama is running (${have.slice(0, 3).join(", ")}). Good for this computer.`; prefer = "local"; }
  else { ai = `Ollama is running. ${rec} suits this computer: run “ollama pull ${rec}”.`; prefer = "local"; }
  const free = p.disk?.free_gb, total = p.disk?.total_gb;
  const short = (m) => (m || "").replace(/\((R|TM)\)/gi, "").replace(/\s+(CPU|Processor)\b.*$/i, "").replace(/\s+/g, " ").trim();
  const rows = [
    { ic: "gear", label: "Processor", val: `${cores} cores`, note: short(p.cpu.model) || "", warn: cores <= 2 },
    { ic: "grid", label: "Memory", val: `${ram} GB`, note: ram < 3.5 ? "Little memory: Wren keeps things light." : ram < 12 ? "Enough for everyday use." : "Plenty of room.", warn: ram < 3.5 },
    { ic: "monitor", label: "Graphics", val: accel ? "Accelerated" : "Software only", note: accel ? g.renderer.replace(/^ANGLE \((.*)\)$/, "$1").split(",").slice(0, 2).join(",").slice(0, 70) : "No GPU acceleration: glass blur and animations would stutter, so they're off.", warn: !accel },
    { ic: "drive", label: "Storage", val: free != null ? `${free} GB free` : "Unknown", note: free != null && total ? (free < 5 ? `Of ${total} GB. Tight: the App Store will warn before big installs.` : `Of ${total} GB.`) : "", warn: free != null && free < 5 },
    ...(p.battery ? [{ ic: "battery", label: "Battery", val: "Yes", note: "Lighter settings also save battery.", warn: false }] : []),
    { ic: "wren", label: "AI", val: prefer === "local" ? "Local" : "Cloud", note: ai, warn: false },
  ];
  TUNE.plan = { tier, rows, prefer, profile: p, accel };
  return TUNE.plan;
}
function applyTuning(plan) {
  const t = TIERS[plan.tier];
  Object.assign(S, { perf: plan.tier, solid: t.solid, blur: t.blur || S.blur, motion: t.motion, termScroll: t.termScroll });
  if (t.blur === 0) S.solid = true;

}

    <span class="tx"><b>${esc(r.label)}</b>${r.note ? `<small>${esc(r.note)}</small>` : ""}</span><span class="val">${esc(r.val)}</span></div>`).join("")}</div>
    <div class="su-tier" style="animation-delay:${plan.rows.length * 0.18}s">${icon("spark", 14, 2)} Tuned for this computer: ${TIERS[plan.tier].name}</div>

async function setupAction(e) {

  if (act === "back") return suBack();
  if (pick("[data-theme]")) { setSetting("theme", pick("[data-theme]").dataset.theme); return renderSetup(); }
  if (pick("[data-accent]")) { setSetting("accent", pick("[data-accent]").dataset.accent); return renderSetup(); }
  if (pick("[data-wall]")) { setSetting("wallpaper", pick("[data-wall]").dataset.wall); return renderSetup(); }
  if (pick("[data-model]")) { SU.model = pick("[data-model]").dataset.model; SU.modelPicked = true; return renderSetup(); }
  if (pick("[data-toggle]")) {
    const k = pick("[data-toggle]").dataset.toggle;
    if (k === "lock") setSetting("lockAfter", S.lockAfter ? 0 : 10);
    if (k === "clip") { SU.clip = !(SU.clip ?? true); api("/clipboard/settings", { enabled: SU.clip }).catch(() => {}); }
    return renderSetup();
  }
  if (pick("[data-net]")) {
    const ssid = pick("[data-net]").dataset.net, n = SU.nets.find((x) => x.ssid === ssid);
    if (n.secure && !n.known && SU.pw !== ssid) { SU.pw = ssid; return renderSetup(); }
    if (SU.pw !== ssid) return suConnect(ssid);
    return;
  }
  if (act === "pair") {
    try {
      const st = await api("/phone/enable", { enabled: true });
      const r = await api("/phone/pair", { ip: st.addresses[0].ip });
      SU.qr = r.svg;
    } catch (err) { SU.msg = err.message; }
    return renderSetup();
  }
  if (act !== "next") {
    if (step === "hello" && !t.closest("button")) return suNext();
    return;
  }
  // Leaving a step: save what it asked.
  if (step === "name") { const v = $("#su-name").value.trim(); if (v) setSetting("name", v); }
  if (step === "wifi" && SU.pw) { const pw = $("#su-pw")?.value; if (pw) return suConnect(SU.pw, pw); }

    const m = SU.info.models.find((x) => x.name === SU.model), keyInput = root.querySelector("[data-key]");

      if (keyInput && keyInput.value.trim()) await api("/secrets", { name: keyInput.dataset.key, value: keyInput.value.trim() });

      const main = [...SESS.values()][0];
      if (main && main.backend !== SU.model) await switchModel(main, SU.model);

}

function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => { blocks.push(`<pre><code>${code.replace(/\n$/, "")}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
       .replace(/^#{1,4} (.*)$/gm, "<b>$1</b>")
       .replace(/^\s*[-*] (.*)$/gm, "• $1")
       .replace(/\n/g, "<br>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}
function addLine(s, cls, html) {

  d.innerHTML = html;

  return d;
}

}

function renderEvent(s, ev) {
  if (ev.type === "route") addLine(s, "route", routeNote(ev));
  else if (ev.type === "queued") addLine(s, "route", `${icon("history", 11)} ${esc(ev.message)}`);
  else if (ev.type === "text") addLine(s, "msg wren", md(ev.text));
  else if (ev.type === "error") addLine(s, "err", esc(ev.message));

    const row = rows.find((r) => r.dataset.name === ev.name) || rows[0];
    if (!row) return;
    row.classList.remove("pending");

      row.classList.add("bad");

      if (!row.querySelector(".approve")) row.insertAdjacentHTML("beforeend", `<div class="hint">Not allowed (${esc(ev.risk)}).</div>`);
    } else {
      row.classList.add(ev.is_error ? "bad" : "ok");
      row.querySelector(".st").innerHTML = ev.is_error ? icon("x", 12, 2.6) : "✓";
      row.querySelector("pre").textContent = ev.output;

}
