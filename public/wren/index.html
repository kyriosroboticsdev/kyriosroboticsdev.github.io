const AP_LABEL = { write_file: "write a file", run_command: "run a command" };
function renderApproval(s, ev) {
  s.apShown = s.apShown || new Set();
  if (s.apShown.has(ev.id)) return;
  s.apShown.add(ev.id);
  const rows = [...s.el.querySelectorAll(".tool.pending")].reverse();
  const row = rows.find((r) => r.dataset.name === ev.name) || s.el;
  const danger = ev.risk === "dangerous";
  const card = el(`<div class="approve ${danger ? "dangerous" : ""}">
    <div>${ev.summary ? `<b>${esc(ev.summary)}</b>` : `Wren wants to <b>${esc(AP_LABEL[ev.name] || ev.name)}</b>`}${danger ? " (this can change your system)" : ""}</div>
    <pre></pre>
    ${ev.undo ? `<div class="ap-undo ${/^Can't/.test(ev.undo) ? "no" : ""}">${esc(ev.undo)}</div>` : ""}
    <div class="ap-btns"><button class="btn" data-a="0">Deny</button>${ev.name === "request_access"
      ? `<button class="btn primary" data-a="1" data-min="30">Allow 30 min</button><button class="btn" data-a="1" data-closed="1">Until the task closes</button>`
      : `<button class="btn primary ${danger ? "danger" : ""}" data-a="1">Allow</button>`}</div></div>`);
  card.dataset.id = ev.id;
  $("pre", card).textContent = ev.detail ?? (ev.name === "run_command" ? ev.input.command : JSON.stringify(ev.input, null, 2));
  if (ev.detail === "") $("pre", card).remove();
  $(".ap-btns", card).onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const allow = b.dataset.a === "1";
    const how = b.dataset.closed ? { until_closed: true } : b.dataset.min ? { minutes: +b.dataset.min } : {};
    $(".ap-btns", card).innerHTML = `<span class="ap-done">${allow ? (b.dataset.closed ? "Allowed until the task closes" : b.dataset.min ? `Allowed for ${b.dataset.min} min` : "Allowed") : "Denied"}</span>`;
    try { await api(`/sessions/${s.id}/approve`, { id: ev.id, allow, ...how }); }
    catch (err) { $(".ap-btns", card).innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    setSessState(s, "thinking"); showTyping(s);
  };
  row.appendChild(card);
  if (s.id === active) s.el.scrollTop = s.el.scrollHeight;
  hideTyping(s);
  setSessState(s, "approval");
}

async function send(text) {
  text = text.trim();
  const s = cur();
  if (!text || !s || s.state === "thinking" || s.state === "approval") return;
  const ctx = W.chips.length ? `\n\n(Context: ${W.chips.join(", ")})` : "";
  addLine(s, "msg user", esc(text) + (W.chips.length ? `<div style="opacity:.6;font-size:11.5px;margin-top:3px">${W.chips.map((c) => esc(c.split(/[\\/]/).pop())).join(", ")}</div>` : ""));
  W.chips = []; renderChips();
  $("#wp-in").value = "";
  $("#opt").hidden = true;
  if (s.autoTitle) renameTask(s, text.split(/\s+/).slice(0, 4).join(" ").replace(/[.,:;!?]+$/, "").slice(0, 28));
  showTyping(s);
  s.streaming = true;
  setSessState(s, "thinking");

  // Streamed text is buffered and rendered at most once per frame.
  let bubble = null, raw = "", queued = false;
  const paint = () => { queued = false; if (bubble) { bubble.innerHTML = md(raw); if (s.id === active) s.el.scrollTop = s.el.scrollHeight; } };
  const endBubble = () => { if (bubble) { paint(); bubble = null; raw = ""; } };
  const handle = (ev) => {
    if (ev.type === "text_delta") {
      hideTyping(s);
      if (!bubble) bubble = addLine(s, "msg wren", "");
      raw += ev.text;
      if (!queued) { queued = true; requestAnimationFrame(paint); }
      return;
    }
    endBubble();
    if (ev.type === "approval_request") return renderApproval(s, ev);
    if (ev.type === "done") { mkSession(ev.status); s.logSeq = ev.status.log_seq; renderMeter(); return; }
    if (ev.type === "usage") {
      if (s.usage) Object.assign(s.usage, { tokens: ev.totals.tokens, cost_usd: ev.totals.cost_usd, cost_reported: ev.totals.cost_reported, cost_estimated: ev.totals.cost_estimated, local_ms: ev.totals.local_ms });
      if (s.id === active) renderMeter();
      return;
    }
    hideTyping(s);
    renderEvent(s, ev);
    if (ev.type === "tool_result" || ev.type === "denied") showTyping(s); // the model reads the result next
  };

  try {
    const r = await fetch(`/sessions/${s.id}/chat/stream`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: text + ctx }) });
    if (!r.ok || !r.body) throw new Error(`${r.status} ${r.statusText}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const data = frame.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trimStart()).join("\n");
        if (data) { try { handle(JSON.parse(data)); } catch (e) { console.error(e); } }
      }
    }
    endBubble(); hideTyping(s);
    s.el.querySelectorAll(".tool.pending").forEach((r) => r.classList.remove("pending"));
    s.streaming = false;
    setSessState(s, W.open && active === s.id ? "idle" : "ready");
  } catch (err) {
    endBubble(); hideTyping(s);
    addLine(s, "err", esc(err.message));
    s.streaming = false;
    setSessState(s, "error");
    setTimeout(() => { if (s.state === "error") setSessState(s, "idle"); }, 4000);
  }
}
$("#wp-form").onsubmit = (e) => { e.preventDefault(); send($("#wp-in").value); };

/* ================= Prompt optimizer ================= */
// Rewrites the draft with the *local* model (it never leaves the machine), so a
// cloud model gets the same request in fewer tokens. Token counts are estimates.
const estTokens = (t) => Math.max(1, Math.round(t.length / 4));
// Things that must survive a rewrite: code, paths, file names, numbers, identifiers.
const keyTerms = (t) => [...new Set(t.match(/`[^`]+`|[\w.~-]*[\/\\][\w.\/\\-]+|\b[\w-]+\.[a-z]{1,5}\b|\b\d+(?:\.\d+)?\b|\b[a-z]+_[a-z0-9_]+\b|\b[a-z]+[A-Z][A-Za-z0-9]*\b/g) || [])];
async function optimizePrompt() {
  const text = $("#wp-in").value.trim();
  if (text.length < 20) return toast("Write a longer prompt first");
  const btn = $("#wp-opt");
  btn.classList.add("busy"); btn.disabled = true;
  try {
    const r = await api("/optimize", { prompt: text });
    showOpt(text, r.optimized, r.model);
  } catch (e) { toast(e.message); }
  btn.classList.remove("busy"); btn.disabled = false;
}
function showOpt(orig, opt, model) {
  const box = $("#opt"), a = estTokens(orig), b = estTokens(opt);
  const missing = keyTerms(orig).filter((t) => !opt.includes(t) && !opt.includes(t.replace(/`/g, "")));
  box.hidden = false;
  box.innerHTML = b >= a || !opt
    ? `<div class="opt-head">${icon("wand", 13, 2)} Your prompt is already concise.</div><div class="ap-btns"><button class="btn" data-a="close">OK</button></div>`
    : `<div class="opt-head">${icon("wand", 13, 2)} Rewritten locally by ${esc(model)} · ≈${a} → ≈${b} tokens <b>−${Math.round(100 - (b * 100) / a)}%</b></div>
       <textarea class="opt-text" rows="3"></textarea>
       ${missing.length ? `<div class="opt-warn">Check these weren't dropped: ${missing.map((m) => `<code>${esc(m)}</code>`).join(" ")}</div>` : ""}
       <div class="ap-btns"><button class="btn" data-a="close">Keep mine</button><button class="btn primary" data-a="use">Use rewrite</button></div>`;
  const ta = $(".opt-text", box);
  if (ta) ta.value = opt;
  box.onclick = (e) => {
    const a = e.target.closest("button")?.dataset.a;
    if (!a) return;
    if (a === "use") $("#wp-in").value = $(".opt-text", box).value;
    box.hidden = true;
    $("#wp-in").focus();
  };
}
$("#wp-opt").onclick = optimizePrompt;

/* ================= Ports & processes ================= */
// Top-bar panel: what's listening on which port, with Open / Ask Wren / Stop.
const PORTS = { list: [], showSystem: false, timer: null };
const fmtUptime = (s) => (s == null ? "" : s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`);
const fmtMem = (b) => (b ? (b < 1048576 ? "<1 MB" : `${Math.round(b / 1048576)} MB`) : "");

async function refreshPorts() {
  try { PORTS.list = (await api("/system/ports")).ports; } catch { PORTS.list = []; }
  const dev = PORTS.list.filter((p) => p.dev).length;
  const b = $("#tb-ports");
  b.classList.toggle("has", dev > 0);
  b.innerHTML = `${icon("plug", 14)}${dev ? `<span>${dev}</span><span class="live"></span>` : ""}`;
  b.title = dev ? `${dev} dev server${dev === 1 ? "" : "s"} running` : "Ports & processes";
  if (!$("#ports-pop").hidden) renderPorts();
}
function renderPorts() {
  const pop = $("#ports-pop");
  const groups = [["Dev servers", PORTS.list.filter((p) => p.dev)], ["Apps", PORTS.list.filter((p) => !p.dev && !p.system)]];
  if (PORTS.showSystem) groups.push(["System", PORTS.list.filter((p) => p.system)]);
  const row = (p) => `
    <div class="pp-row" data-pid="${p.pid}" data-port="${p.port}">
      <span class="pp-port">:${p.port}</span>
      <span class="pp-name" title="${esc(p.command || p.name)}"><b>${esc(p.name)}</b> <span style="color:var(--fg-dim);font-size:12px">${[fmtMem(p.memory_bytes), fmtUptime(p.uptime_secs)].filter(Boolean).join(" · ")}</span>
        <small>${esc(p.command || `PID ${p.pid}`)}</small></span>
      <span class="pp-acts">
        <button class="icon-btn" data-a="open" title="Open http://localhost:${p.port}">${icon("globe", 15)}</button>
        <button class="icon-btn" data-a="ask" title="Ask Wren about this">${icon("wren", 16)}</button>
        ${p.system ? "" : `<button class="icon-btn stop" data-a="stop" title="Stop ${esc(p.name)}">${icon("stop", 14)}</button>`}
      </span>
    </div>`;
  const body = groups.filter(([, l]) => l.length).map(([g, l]) => `<div class="pp-grp">${g}</div>${l.map(row).join("")}`).join("");
  pop.innerHTML = `
    <div class="pp-head">${icon("plug", 15)}<span class="grow">Ports</span>
      <label>Show system <button class="toggle ${PORTS.showSystem ? "on" : ""}" data-a="sys" role="switch" aria-checked="${PORTS.showSystem}"></button></label>
      <button class="icon-btn" data-a="refresh" title="Refresh">${icon("refresh", 15)}</button></div>
    <div class="pp-list">${body || `<div class="pp-empty">Nothing is listening right now.<br>Start a dev server and it shows up here.</div>`}</div>`;
}
$("#ports-pop").onclick = async (e) => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const a = b.dataset.a, r = b.closest(".pp-row");
  const p = r && PORTS.list.find((x) => x.pid === +r.dataset.pid && x.port === +r.dataset.port);
  if (a === "sys") { PORTS.showSystem = !PORTS.showSystem; renderPorts(); }
  if (a === "refresh") refreshPorts();
  if (a === "open") launchApp("browser", "Zen Browser", `http://localhost:${p.port}`);
  if (a === "ask") {
    closePorts(); openWren();
    send(`What is the process listening on port ${p.port} (${p.name}, PID ${p.pid}${p.command ? `, command: ${p.command}` : ""})? Is it safe to stop?`);
  }
  if (a === "stop") {
    // Second click confirms.
    b.outerHTML = `<button class="icon-btn confirm" data-a="confirm">Stop?</button>`;
    setTimeout(() => { const c = r.querySelector('[data-a="confirm"]'); if (c) renderPorts(); }, 3000);
  }
  if (a === "confirm") {
    try { toast((await api("/system/stop", { pid: p.pid })).message); } catch (err) { toast(err.message); }
    setTimeout(refreshPorts, 400);
  }
};

/* ================= Clipboard history ================= */
// The service watches the clipboard and keeps history in memory only. Plain
// actions (format JSON, decode URL, ...) run right here; AI actions run on the
// local model. Items that look like secrets arrive masked and stay that way.
const CLIP = { items: [], enabled: true, available: true, timer: null, results: {} };
const KIND_LABEL = { json: "JSON", url: "Link", error: "Error", path: "Path", color: "Color", code: "Code", text: "Text", secret: "Secret" };
const AI_ACTIONS = {
  json: [["ts_type", "TypeScript type"]],
  error: [["explain_error", "Explain"]],
  code: [["explain_code", "Explain"]],
  text: [["summarize", "Summarize"], ["concise", "Make concise"]],
};
const ago = (ts) => { const s = Math.max(0, Date.now() / 1000 - ts); return s < 60 ? "now" : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`; };

async function refreshClip() {
  try { const r = await api("/clipboard"); Object.assign(CLIP, { items: r.items, enabled: r.enabled, available: r.available }); } catch {}
  $("#tb-clip").innerHTML = icon("clip", 14);
  $("#tb-clip").style.opacity = CLIP.enabled && CLIP.available ? "" : ".45";
  if (!$("#clip-pop").hidden) renderClip();
}
async function clipText(c) { return (await api(`/clipboard/${c.id}`)).text; }
async function copyText(text) { await api("/clipboard/copy", { text }); toast("Copied"); }

function renderClip() {
  const pop = $("#clip-pop");
  const plain = (c) => {
    const acts = [];
    if (c.kind === "json") acts.push(["format", "Format"], ["minify", "Minify"]);
    if (c.kind === "url") acts.push(["open", "Open in Zen"]);
    if (c.kind === "url" && /%[0-9a-f]{2}/i.test(c.preview)) acts.push(["decode", "Decode"]);
    if (c.kind === "path") acts.push(["files", "Show in Files"]);
    return acts;
  };
  const item = (c) => {
    const text = c.kind === "color" ? `<span class="clip-swatch" style="background:${esc(c.preview)}"></span>${esc(c.preview)}` : esc(c.preview);
    const acts = c.sensitive ? [] : [
      ...plain(c).map(([a, n]) => `<button data-a="${a}">${n}</button>`),

// Launchpad-style grid of installed apps (from the system's own app list) plus
// Wren's built-in apps. Type to filter, arrows + Enter, Esc to close.
const LN = { apps: [], loading: false, sel: 0, shown: [], rows: [], armed: null, ports: null, change: null };
const BUILTIN = [
  { key: "@files", name: "File Explorer", builtin: true, tile: "linear-gradient(160deg,#5ab0ff,#2563eb)", ic: "folder", run: () => openFiles("~") },
  { key: "@store", name: "App Store", builtin: true, tile: "linear-gradient(160deg,#6ea8ff,#7c5cff)", ic: "bag", run: () => openStore() },

  { key: "@settings", name: "Settings", builtin: true, tile: "linear-gradient(160deg,#a3aab8,#4b5260)", ic: "gear", run: () => openSettings() },
  { key: "@wren", name: "Wren", builtin: true, tile: "radial-gradient(circle at 35% 30%, #fff 0%, var(--accent) 45%, color-mix(in srgb, var(--accent) 50%, #000) 100%)", ic: "wren", run: () => openWren() },

const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

async function loadApps() {

function score(name, q) {
  const n = name.toLowerCase();
  if (n.startsWith(q)) return 3;
  if (n.split(/[\s\-_.()]+/).some((w) => w.startsWith(q))) return 2;
  if (n.includes(q)) return 1;
  // Initials: "vsc" -> Visual Studio Code
  const initials = n.split(/[\s\-_.()]+/).filter(Boolean).map((w) => w[0]).join("");
  return initials.startsWith(q) ? 1 : 0;
}
function tileHTML(a, i) {

    ? `<div class="tile" style="background:${a.tile}">${icon(a.ic, 26, 1.9)}</div>`
    : a.has_icon
      ? `<img src="store/icon/${a.key}" alt="" loading="lazy">`
      : `<div class="tile" style="background:hsl(${hue(a.name)} 45% 42%)">${esc(a.name.trim()[0] || "?")}</div>`;
  return `<button class="ln-app ${i === LN.sel ? "sel" : ""}" data-i="${i}" title="${esc(a.name)}"><span class="ln-ic">${ic}</span><span class="ln-name">${esc(a.name)}</span></button>`;
}
function renderLauncher() {

  $("#ln-hint").hidden = !!q;
  if (q) return renderCommands(q, all);
  const counts = launches();
  const frequent = all.filter((a) => counts[a.key]).sort((x, y) => counts[y.key] - counts[x.key]).slice(0, 8);
  const rest = all.filter((a) => !frequent.includes(a));

  const body = $("#ln-body");
  body.innerHTML = (frequent.length ? `<div class="ln-sec">Frequent</div>${grid(frequent)}` : "") +
    `<div class="ln-sec">All apps${LN.loading ? " · finding apps…" : ` · ${LN.apps.length + BUILTIN.length}`}</div>${grid(rest)}`;
  body.querySelector(".ln-app.sel")?.scrollIntoView({ block: "nearest" });
}
async function launchItem(a) {

const toggleLauncher = () => ($("#launcher").classList.contains("open") ? closeLauncher() : openLauncher());
/** Arrow keys move the selection by grid rows/columns; Enter launches. Returns true if handled. */
function launcherKey(e) {
  if (e.key === "Escape") { if (LN.armed != null) { LN.armed = null; renderLauncher(); } else closeLauncher(); return true; }
  if (LN.rows.length) {
    if (e.key === "Enter") { e.preventDefault(); runRow(LN.sel); return true; }
    const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
    if (step === undefined) return false;
    e.preventDefault();
    let i = LN.sel;
    do { i = Math.max(0, Math.min(LN.rows.length - 1, i + step)); } while (!LN.rows[i].run && i > 0 && i < LN.rows.length - 1);
    LN.sel = i; LN.armed = null; renderLauncher();
    return true;
  }
  if (e.key === "Enter") {
    const a = LN.shown[LN.sel];
    if (a) launchItem(a); else if ($("#ln-q").value.trim()) $("#ln-body [data-act='ask']")?.click();
    e.preventDefault(); return true;
  }
  const grid = $("#ln-body .ln-grid");
  const cols = grid ? getComputedStyle(grid).gridTemplateColumns.split(" ").length : 1;
  const move = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
  if (move === undefined || !LN.shown.length) return false;
  e.preventDefault();
  LN.sel = Math.max(0, Math.min(LN.shown.length - 1, LN.sel + move));
  renderLauncher();
  return true;
}

/* ================= Resources ================= */
// What's using the computer and what to do about it. Opens from the top-bar stats.
const RES = { timer: null, last: null, pressure: "ok", told: false };
const fmtGB = (b) => (b >= 10 * 1073741824 ? `${(b / 1073741824).toFixed(0)} GB` : b >= 1073741824 ? `${(b / 1073741824).toFixed(1)} GB` : `${Math.round(b / 1048576)} MB`);
async function refreshRes() {
  try { RES.last = await api("/system/resources"); } catch (e) { RES.last = { error: e.message }; }
  if (!$("#res-pop").hidden) renderRes();
}
function renderRes() {
  const r = RES.last, pop = $("#res-pop");
  if (!r) { pop.innerHTML = `<div class="pp-head">Resources</div><div class="pp-empty">Checking…</div>`; return; }
  if (r.error) { pop.innerHTML = `<div class="pp-head">Resources</div><div class="pp-empty">${esc(r.error)}</div>`; return; }
  const m = r.memory, used = m.total - m.available;
  // The memory bar: Wren, the local model, the biggest apps, everything else, free.
  const cols = { wren: "var(--accent)", model: "#c084fc", a0: "#38bdf8", a1: "#34d399", a2: "#fbbf24", other: "rgb(var(--card-rgb) / .6)" };
  const wren = r.groups.filter((g) => g.kind === "wren").reduce((n, g) => n + g.memory, 0);
  const model = Math.max(r.groups.filter((g) => g.kind === "model").reduce((n, g) => n + g.memory, 0), r.models.reduce((n, x) => n + x.memory, 0));
  const apps = r.groups.filter((g) => g.kind === "app").slice(0, 3);
  const parts = [["Wren", wren, cols.wren], ["Local model", model, cols.model], ...apps.map((g, i) => [g.name, g.memory, cols["a" + i]])].filter(([, v]) => v > 0);
  const known = parts.reduce((n, [, v]) => n + v, 0);
  parts.push(["Other", Math.max(0, used - known), cols.other]);
  const pct = (v) => `${Math.max(0, (v / m.total) * 100).toFixed(2)}%`;
  const label = { ok: "Running smoothly", high: "Memory is getting full", critical: "Memory is almost full" }[r.pressure];
  const fixBtn = (f) => (f ? `<button class="btn" data-fix="${esc(f.kind)}" data-arg="${esc(f.arg || "")}">${esc(f.label)}</button>` : "");
  pop.innerHTML = `<div class="pp-head">Resources <small style="font-weight:400;color:var(--fg-dim)">· ${esc(label)}</small><span class="grow"></span>
      <button class="icon-btn" data-a="ports" title="Ports & processes">${icon("plug", 15)}</button></div>` +
    (r.issues.length ? r.issues.map((i) => `<div class="rs-issue ${esc(i.level)}"><p>${esc(i.text)}</p>${fixBtn(i.fix)}</div>`).join("") : "") +
    `<div class="rs-sec"><span>Memory</span><span>${fmtGB(used)} of ${fmtGB(m.total)}${m.psi != null ? ` · waiting ${m.psi.toFixed(0)}%` : ""}</span></div>
    <div class="rs-bar">${parts.map(([n, v, c]) => `<i style="width:${pct(v)};background:${c}" title="${esc(n)}: ${fmtGB(v)}"></i>`).join("")}</div>
    <div class="rs-legend">${parts.map(([n, v, c]) => `<span style="--c:${c}">${esc(n)} ${fmtGB(v)}</span>`).join("")}</div>` +
    (r.models.length ? `<div class="rs-sec"><span>Local models loaded</span></div>` + r.models.map((x) => `<div class="rs-model">${icon("lock", 13)}<b>${esc(x.name)}</b><span style="color:var(--fg-dim)">${fmtGB(x.memory)}</span>
      <button class="btn" data-fix="unload-model" data-arg="${esc(x.name)}">Unload</button></div>`).join("") : "") +
    `<div class="rs-sec"><span>Apps</span><span>memory · CPU</span></div>` +
    r.groups.slice(0, 8).map((g) => `<div class="rs-row"><b>${esc(g.name)}</b><span>${fmtGB(g.memory)}</span><span>${(g.cpu / r.cpu.cores).toFixed(0)}%</span></div>`).join("") +
    (r.disk.total ? `<div class="rs-sec"><span>Disk</span><span>${fmtGB(r.disk.free)} free of ${fmtGB(r.disk.total)}</span></div>` : "");
}
function openRes() {
  closePorts(); closeClip();
  $("#res-pop").hidden = false; $("#tb-stats").classList.add("open");
  renderRes(); refreshRes();
  clearInterval(RES.timer); RES.timer = setInterval(refreshRes, S.perf === "light" ? 6000 : 3000);
}
function closeRes() { if ($("#res-pop").hidden) return; $("#res-pop").hidden = true; $("#tb-stats").classList.remove("open"); clearInterval(RES.timer); }
$("#res-pop").onclick = async (e) => {
  e.stopPropagation();

  if (!b) return;
  if (b.dataset.a === "ports") { closeRes(); return openPorts(); }

  if (kind === "files") { closeRes(); return openFiles("~"); }

  try { toast((await api("/system/resources/fix", { kind, arg })).message); } catch (er) { toast(er.message); }
  refreshRes();
};
// Under memory pressure the desktop drops its costly effects (blur, animation) until it eases.
function applyPressure(level) {
  if (level === RES.pressure) return;
  RES.pressure = level;
  document.documentElement.dataset.pressure = level;
  if (level !== "ok" && !RES.told) { RES.told = true; toast("Memory is tight: Wren turned off its visual effects until it eases"); }
  if (level === "ok") RES.told = false;
}

// CPU · RAM · temperature. Refreshes less often on lighter hardware tiers, and not at all while hidden.
const STATS = { timer: null, last: null };

  const b = $("#tb-stats");

    try { STATS.last = await api("/system/stats"); } catch { STATS.last = null; }

    if (st) {
      const ram = st.ram_total ? Math.round((st.ram_used / st.ram_total) * 100) : 0;
      const lvl = (v, warn, hot) => (v >= hot ? "hot" : v >= warn ? "warn" : "");
      const gb = (x) => (x / 1073741824).toFixed(1);
      applyPressure(st.pressure || "ok");
      b.innerHTML = (st.issues ? `<span class="dot-warn ${st.pressure === "critical" ? "crit" : ""}" title="Something needs a look"></span>` : "") +
        `<span class="s ${lvl(st.cpu, 70, 90)}"><small>CPU</small>${Math.round(st.cpu)}%</span>` +
        `<span class="s ${lvl(ram, 80, 92)}"><small>RAM</small>${ram}%</span>` +
        (st.temp != null ? `<span class="s ${lvl(st.temp, 80, 92)}">${Math.round(st.temp)}°</span>` : "");
      b.title = `CPU ${st.cpu.toFixed(0)}% · memory ${gb(st.ram_used)} of ${gb(st.ram_total)} GB` +
        (st.temp != null ? ` · CPU ${st.temp.toFixed(0)} °C (${st.temp_source})` : st.temp_hint ? ` · ${st.temp_hint}` : "") + "\nClick: what's using them";
    }

// Typing in Ctrl+K turns the app grid into one list: commands that run right away

// projects), and Wren for anything else. Commands that can't be taken back
// (stopping a process, undo, restart) say exactly what they'll do and need a
// second Enter.
const SET_WORDS = [
  [["wifi", "wi-fi", "network", "internet", "ethernet"], "network", "Wi-Fi & network", "wifi"],
  [["bluetooth", "bt", "headphones"], "bluetooth", "Bluetooth", "bt"],
  [["display", "screen", "brightness", "sound", "volume", "audio", "speaker"], "display", "Display & sound", "sun"],
  [["power", "battery", "power mode"], "power", "Power & battery", "power"],
  [["lock screen", "password", "fingerprint", "auto lock"], "lock", "Lock screen", "lock"],
  [["personalization", "theme", "wallpaper", "appearance", "accent", "font", "dark mode", "light mode"], "personal", "Personalization", "palette"],
  [["keys", "secrets", "api key", "api keys", "vault"], "secrets", "Keys & secrets", "lock"],
  [["phone", "pair phone", "android"], "phone", "Phone", "phone"],
  [["dock", "top bar", "taskbar", "clock"], "desktop", "Top bar & dock", "layout"],
  [["model", "models", "ai", "wren settings", "budget"], "wren", "Wren", "wren"],

  [["about", "version", "system info", "specs"], "about", "About", "info"],

const wordHit = (q, words) => words.some((w) => (q.length > 1 && w.startsWith(q)) || q.startsWith(w + " ") || q === w);
const pct = (x) => Math.max(0, Math.min(100, Math.round(+x)));
const rest = (raw) => raw.split(/\s+/).slice(1).join(" ");

async function cmdApi(path, body, done) {

}
async function stopPid(p) {

function cmdRows(q, all) {
  const rows = [], raw = $("#ln-q").value.trim();
  const add = (r) => rows.push(r);
  let m;

  // ----- commands that run right away
  if ((m = q.match(/^(wifi|wi-fi)\s+(on|off)$/))) add({ sec: "Command", ic: "wifi", title: `Turn Wi-Fi ${m[2]}`, run: () => cmdApi("/settings/wifi", { enabled: m[2] === "on" }, `Wi-Fi ${m[2]}`) });
  // Just "wifi" or "bluetooth": offer the opposite of how it is now.
  const st = QS.st;
  if (st?.wifi?.can_toggle && wordHit(q, ["wifi", "wi-fi"]) && !/\s(on|off)$/.test(q)) { const on = !st.wifi.enabled; add({ sec: "Command", ic: "wifi", title: `Turn Wi-Fi ${on ? "on" : "off"}`, run: () => cmdApi("/settings/wifi", { enabled: on }, `Wi-Fi ${on ? "on" : "off"}`) }); }
  if (st?.bluetooth && wordHit(q, ["bluetooth"]) && !/\s(on|off)$/.test(q)) { const on = !st.bluetooth.powered; add({ sec: "Command", ic: "bt", title: `Turn Bluetooth ${on ? "on" : "off"}`, run: () => cmdApi("/settings/bluetooth", { enabled: on }, `Bluetooth ${on ? "on" : "off"}`) }); }

/* ================= Window manager ================= */
const wins = new Map();

  if (wins.has(id)) { const x = wins.get(id); x.el.classList.remove("min"); focusWin(id); return x; }

  w = Math.min(w, vw - 40); h = Math.min(h, vh - BAR - 100);
  const off = wins.size * 28;
  const e = el(`<div class="win"><div class="win-title"><span style="display:grid">${ic}</span><span class="name">${esc(title)}</span>
    <div class="caps"><button data-a="min" title="Minimize">${icon("min", 14, 1.4)}</button><button data-a="max" title="Maximize">${icon("max", 12, 1.4)}</button><button data-a="close" class="close" title="Close">${icon("x", 14, 1.4)}</button></div></div>
    <div class="win-body"></div></div>`);
  Object.assign(e.style, { width: w + "px", height: h + "px", left: Math.max(20, (vw - w) / 2 + off - 40) + "px", top: Math.max(BAR + 12, (vh - h) / 2 + off - 40) + "px" });
  $("#windows").appendChild(e);

  $(".caps", e).onclick = (ev) => {
    const a = ev.target.closest("button")?.dataset.a;
    if (a === "close") { e.remove(); wins.delete(id); focusWin(null); renderDock(); closeSnapAssist(); }
    if (a === "min") { e.classList.add("min"); focusWin(null); }
    if (a === "max") toggleMax(win);

  const tb = $(".win-title", e);
  tb.ondblclick = (ev) => { if (!ev.target.closest(".caps")) toggleMax(win); };
  tb.addEventListener("pointerdown", (ev) => { if (!ev.target.closest(".caps") && ev.button === 0) dragWindow(win, ev); });

  maxBtn.onmouseleave = () => { clearTimeout(flyTimer); flyTimer = setTimeout(() => { if (!$("#snap-fly").matches(":hover")) closeSnapFlyout(); }, 300); };

/* ================= Window organizer ================= */
// Snap Layouts like Windows 11: drag a window to an edge or corner, pick a
// layout from the maximize button, or use Super+arrows; then Snap Assist
// offers the other windows for the free spots. Windows resize from any edge.
const GAP = 6;
// Zones as fractions of the work area (below the top bar, above the dock).
const Z = {
  max: [0, 0, 1, 1], left: [0, 0, .5, 1], right: [.5, 0, .5, 1],
  tl: [0, 0, .5, .5], tr: [.5, 0, .5, .5], bl: [0, .5, .5, .5], br: [.5, .5, .5, .5],
  l67: [0, 0, 2 / 3, 1], r33: [2 / 3, 0, 1 / 3, 1], l33: [0, 0, 1 / 3, 1], m33: [1 / 3, 0, 1 / 3, 1], r67: [1 / 3, 0, 2 / 3, 1],
};
const LAYOUTS = [["left", "right"], ["l67", "r33"], ["l33", "m33", "r33"], ["tl", "tr", "bl", "br"], ["left", "tr", "br"], ["l33", "r67"]];
function workArea() {
  const dock = $("#dock")?.getBoundingClientRect();
  const bottom = dock && dock.height ? Math.min(innerHeight, dock.top - GAP) : innerHeight;
  // Clear of the task tabs on the left edge when they're shown.
  const left = document.body.classList.contains("tabs-on") ? 28 : 0;
  return { x: left, y: BAR, w: innerWidth - left, h: bottom - BAR };
}
function zoneRect(name) {
  const [fx, fy, fw, fh] = Z[name], a = workArea();
  if (name === "max") return { left: a.x, top: BAR, width: innerWidth - a.x, height: innerHeight - BAR };
  const g = GAP;
  return { left: a.x + fx * a.w + g, top: a.y + fy * a.h + g, width: fw * a.w - g * 1.5, height: fh * a.h - g * 1.5 };

const px = (r) => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });

// Which zone a drag at (x, y) would snap to.
function edgeZone(x, y) {

function addResizers(win) {

        if (d.includes("s")) e.style.height = Math.max(minH, r0.h + dy) + "px";

/* ================= Context menu ================= */
/* ================= Context menus: a marking menu (Fusion-style) ================= */
// Right-click opens a ring of up to 8 actions around the cursor, the ones used most
// in this menu (positions stay put, so your hand learns them), and a list box below
// with the rest. Click an action, or hold the right button, flick toward one and
// let go. Escape or clicking elsewhere closes it.
const CTX = { open: false, cx: 0, cy: 0, ring: [], list: [], hot: -1, key: "", held: false, at: 0 };
const RING_R = 92, RING_MAX = 8;
let lastButtons = 0;
addEventListener("pointerdown", (e) => { lastButtons = e.buttons; }, true);
addEventListener("pointerup", (e) => { lastButtons = e.buttons; }, true);

function ctxRun(it) {
  if (!it?.run) return;
  const use = store.get("wren.ctxUse", {}), k = `${CTX.key}\u0000${it.label}`;
  use[k] = (use[k] || 0) + 1;
  store.set("wren.ctxUse", use);
  closeCtx();
  it.run();
}
/** items: [{ label, ic, run, ai?, short? } | "-"]; key names the menu, so it learns per menu. */
function openCtx(x, y, items, key) {
  const all = items.filter((i) => i !== "-");
  if (!all.length) return;
  CTX.key = key || all.slice(0, 3).map((i) => i.label).join("|");
  const use = store.get("wren.ctxUse", {}), used = (it) => use[`${CTX.key}\u0000${it.label}`] || 0;
  // The ring: the most used (ties keep the menu's own order), shown in the menu's order.
  const pick = all.length <= RING_MAX ? all : [...all].map((it, i) => [it, i]).sort((a, b) => used(b[0]) - used(a[0]) || a[1] - b[1]).slice(0, RING_MAX).map(([it]) => it);
  CTX.ring = all.filter((it) => pick.includes(it));
  // The list: the rest, separators kept where they still separate something.
  CTX.list = items.filter((it) => it === "-" || !pick.includes(it))
    .filter((it, i, a) => it !== "-" || (i > 0 && i < a.length - 1 && a[i - 1] !== "-"));
  const listN = CTX.list.filter((i) => i !== "-").length;
  // The ring stays centered on the pointer (only nudged in at the screen's edges), so a
  // flick in a direction always means the same action; the list goes wherever it fits.
  CTX.cx = Math.max(RING_R + 120, Math.min(innerWidth - RING_R - 120, x));
  CTX.cy = Math.max(RING_R + 30, Math.min(innerHeight - RING_R - 30, y));
  CTX.hot = -1; CTX.open = true; CTX.at = Date.now();
  CTX.held = !!(lastButtons & 2); // right button still down: a release on an action picks it
  const c = $("#ctx");
  const n = CTX.ring.length;
  c.innerHTML = `<svg class="cx-hub" width="56" height="56" viewBox="-28 -28 56 56" style="left:${CTX.cx - 28}px;top:${CTX.cy - 28}px">
      <circle r="22" class="cx-disc"/><path class="cx-wedge" d=""/><circle r="4" class="cx-dot"/></svg>` +
    CTX.ring.map((it, i) => `<button class="cx-item${it.ai ? " ai" : ""}" data-i="${i}" title="${esc(it.label)}">${it.ic}<span>${esc(it.short || it.label)}</span></button>`).join("") +
    (listN ? `<div class="cx-list glass">${CTX.list.map((it, j) => it === "-" ? "<hr>" : `<button class="${it.ai ? "ai" : ""}" data-j="${j}">${it.ic}<span>${esc(it.label)}</span></button>`).join("")}</div>` : "");
  c.classList.add("open");
  // Place each action on the ring, its inner edge toward the center.
  $$(".cx-item", c).forEach((b, i) => {
    const a = (-90 + (i * 360) / n) * (Math.PI / 180), cos = Math.cos(a), sin = Math.sin(a);
    const w = b.offsetWidth, h = b.offsetHeight;
    const px = CTX.cx + cos * RING_R, py = CTX.cy + sin * RING_R;
    const left = Math.abs(cos) < 0.35 ? px - w / 2 : cos > 0 ? px - 14 : px - w + 14;
    b.style.left = Math.max(6, Math.min(innerWidth - w - 6, left)) + "px";
    b.style.top = py - h / 2 + "px";
    b.dataset.a = a;
  });
  const list = $(".cx-list", c);
  if (list) {
    const w = list.offsetWidth, h = list.offsetHeight, gap = RING_R + 34;
    let left = CTX.cx - w / 2, top = CTX.cy + gap;          // below the ring
    if (top + h > innerHeight - 8) top = CTX.cy - gap - h;  // else above it
    if (top < 8) {                                          // else beside it
      top = Math.max(8, Math.min(innerHeight - h - 8, CTX.cy - h / 2));
      left = CTX.cx + RING_R + 130 + w < innerWidth ? CTX.cx + RING_R + 120 : CTX.cx - RING_R - 120 - w;
    }
    list.style.left = Math.max(8, Math.min(innerWidth - w - 8, left)) + "px";
    list.style.top = top + "px";
  }
}
function closeCtx() { CTX.open = false; CTX.hot = -1; $("#ctx").classList.remove("open"); $("#ctx").innerHTML = ""; }
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
// Which action the pointer points at: by direction from the center, once it's left the hub.
function ctxAim(x, y) {
  const dx = x - CTX.cx, dy = y - CTX.cy, n = CTX.ring.length;
  if (!n || Math.hypot(dx, dy) < 22 || Math.hypot(dx, dy) > RING_R * 2.2) return -1;
  const deg = (Math.atan2(dy, dx) * 180) / Math.PI + 90; // 0 = straight up
  return Math.round((((deg % 360) + 360) % 360) / (360 / n)) % n;
}
function ctxPaint() {
  $$(".cx-item", $("#ctx")).forEach((b, i) => b.classList.toggle("hot", i === CTX.hot));
  const wedge = $(".cx-wedge", $("#ctx"));
  if (!wedge) return;
  if (CTX.hot < 0) return wedge.setAttribute("d", "");
  const n = CTX.ring.length, mid = -90 + (CTX.hot * 360) / n, half = Math.min(180 / n, 40);
  const pt = (deg, r) => `${(Math.cos((deg * Math.PI) / 180) * r).toFixed(1)} ${(Math.sin((deg * Math.PI) / 180) * r).toFixed(1)}`;
  wedge.setAttribute("d", `M ${pt(mid - half, 10)} L ${pt(mid - half, 26)} A 26 26 0 0 1 ${pt(mid + half, 26)} L ${pt(mid + half, 10)} A 10 10 0 0 0 ${pt(mid - half, 10)} Z`);
}
addEventListener("pointermove", (e) => {
  if (!CTX.open) return;
  const onList = e.target.closest?.(".cx-list");
  const hot = onList ? -1 : e.target.closest?.(".cx-item") ? +e.target.closest(".cx-item").dataset.i : ctxAim(e.clientX, e.clientY);
  if (hot !== CTX.hot) { CTX.hot = hot; ctxPaint(); }
}, true);
// Clicks while it's open: an action, a list row, a direction, or outside (close).
addEventListener("pointerdown", (e) => {
  if (!CTX.open || e.button === 2) return;
  const item = e.target.closest?.(".cx-item"), row = e.target.closest?.(".cx-list [data-j]");
  if (e.target.closest?.(".cx-list") && !row) return; // a gap in the list
  e.preventDefault(); e.stopPropagation();
  if (item) return ctxRun(CTX.ring[+item.dataset.i]);
  if (row) return ctxRun(CTX.list[+row.dataset.j]);
  const aim = ctxAim(e.clientX, e.clientY);
  if (aim >= 0 && Math.hypot(e.clientX - CTX.cx, e.clientY - CTX.cy) < RING_R + 60) return ctxRun(CTX.ring[aim]);
  closeCtx();
}, true);
// The marking gesture: right button held from opening, released while aiming at an action.
addEventListener("pointerup", (e) => {
  if (!CTX.open || e.button !== 2 || !CTX.held) return;
  CTX.held = false;
  if (Date.now() - CTX.at > 180 && CTX.hot >= 0) ctxRun(CTX.ring[CTX.hot]);
}, true);
// The click that follows a pointerdown handled above must not reach what's underneath.
addEventListener("click", (e) => { if (e.target.closest?.("#ctx")) { e.preventDefault(); e.stopPropagation(); } }, true);
addEventListener("keydown", (e) => { if (CTX.open && e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeCtx(); } }, true);

// Text: Cut, Copy, Paste, Select all in text boxes; Copy / Ask Wren / Search for a selection elsewhere.
async function pasteInto(t) {
  let text = "";
  try { text = await navigator.clipboard.readText(); } catch {}
  if (!text) try { text = (await api("/clipboard")).items?.[0]?.text || ""; } catch {}
  if (!text) return toast("Nothing to paste");
  t.focus(); t.setRangeText(text, t.selectionStart ?? t.value.length, t.selectionEnd ?? t.value.length, "end");
  t.dispatchEvent(new Event("input", { bubbles: true }));
}
function textMenu(e) {
  const t = e.target.closest("input:not([type=range]):not([type=checkbox]), textarea");
  const sel = t ? t.value.slice(t.selectionStart ?? 0, t.selectionEnd ?? 0) : String(getSelection() || "").trim();
  if (t && !t.readOnly && !t.disabled) {
    openCtx(e.clientX, e.clientY, [
      { label: "Cut", ic: icon("x", 15), run: () => { if (!sel) return; copyText(sel); t.setRangeText("", t.selectionStart, t.selectionEnd, "end"); t.dispatchEvent(new Event("input", { bubbles: true })); } },
      { label: "Copy", ic: icon("copy", 15), run: () => sel && copyText(sel) },
      { label: "Paste", ic: icon("clip", 15), run: () => pasteInto(t) },
      { label: "Select all", ic: icon("dots", 15), run: () => { t.focus(); t.select(); } },
    ], "text-input");
    return true;
  }
  if (!t && sel) {
    openCtx(e.clientX, e.clientY, [
      { label: "Copy", ic: icon("copy", 15), run: () => copyText(sel) },
      { label: "Ask Wren about this", short: "Ask Wren", ic: icon("wren", 15, 2), ai: true, run: () => { openWren(); send(`About this:\n\n${sel}`); } },
      { label: "Search the web", ic: icon("globe", 15), run: () => launchApp("browser", "Zen Browser", `https://duckduckgo.com/?q=${encodeURIComponent(sel.slice(0, 200))}`) },
    ], "selection");
    return true;
  }
  return false;
}

// The dock: an app's windows (switch, minimize, close), a new window, or Wren's own windows.
function dockMenu(e, it, ws) {
  e.preventDefault(); e.stopPropagation();
  const items = [];
  if (ws?.length) {
    const g = ws[0].app;
    const name = g?.name || ws[0].app_id;
    if (g) items.push({ label: "New window", ic: icon("plus", 15), run: () => { const a = LN.apps.find((x) => x.key === g.key); a ? launchItem(a) : api("/launcher/launch", { key: g.key }).catch((er) => toast(er.message)); } });
    else if (it?.run) items.push({ label: "New window", ic: icon("plus", 15), run: it.run });
    const anyUp = ws.some((w) => !w.minimized);
    items.push({ label: anyUp ? "Minimize" : "Restore", ic: icon(anyUp ? "min" : "max", 15), run: () => ws.forEach((w) => api(`/windows/${w.id}/${anyUp ? "minimize" : "activate"}`, {}).catch(() => {})) });
    items.push({ label: ws.length > 1 ? `Close all ${ws.length} windows` : `Close ${name}`, short: "Close", ic: icon("x", 15), run: () => ws.forEach((w) => api(`/windows/${w.id}/close`, {}).catch((er) => toast(er.message))) });
    if (ws.length > 1) items.push("-", ...ws.map((w) => ({ label: w.title || name, ic: icon("layout", 15), run: () => api(`/windows/${w.id}/activate`, {}).catch(() => {}) })));
  } else if (it) {
    const win = wins.get(it.id);
    items.push({ label: win ? "Show" : "Open", ic: icon("open", 15), run: it.run });
    if (win) {
      items.push({ label: "Minimize", ic: icon("min", 15), run: () => win.el.querySelector('[data-a="min"]')?.click() });
      items.push({ label: "Close", ic: icon("x", 15), run: () => win.el.querySelector('[data-a="close"]')?.click() });
    }
  }
  if (items.length) openCtx(e.clientX, e.clientY, items, `dock:${it?.id || ws?.[0]?.app?.key || "app"}`);
}

/* ================= Files ================= */
const PLACES = [
  ["Home", "~", "home"], ["Desktop", "~/Desktop", "monitor"], ["Documents", "~/Documents", "doc"], ["Downloads", "~/Downloads", "download"],
  ["Pictures", "~/Pictures", "image"], ["Music", "~/Music", "music"], ["Videos", "~/Videos", "video"],
];
const IMG_EXT = /\.(png|jpe?g|gif|webp|bmp|svg|heic)$/i;
const fmtSize = (n) => (n < 1024 ? (n ? "1 KB" : "0 KB") : n < 1048576 ? Math.ceil(n / 1024).toLocaleString() + " KB" : (n / 1048576).toFixed(1) + " MB");
const fmtDate = (t) => (t ? new Date(t * 1000).toLocaleString([], { month: "numeric", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) : "");
const fileType = (e) => (e.dir ? "File folder" : /\.([^.]+)$/.test(e.name) ? e.name.split(".").pop().toUpperCase() + " File" : "File");

function openFiles(path) {
  if (wins.has("files")) { const w = createWindow({ id: "files" }); w.nav(path); return; }
  createWindow({ id: "files", title: "File Explorer", ic: FOLDER_ICON.replace(/18/g, "16"), w: 920, h: 560, mount: (win) => mountFiles(win, path) });
}
function mountFiles(win, start) {
  const st = { path: "", sep: "/", back: [], fwd: [], entries: [], filter: "", sel: null, parent: null };
  win.body.innerHTML = `
    <div class="ex-cmd">
      <button class="icon-btn" data-a="back" title="Back">${icon("back")}</button>
      <button class="icon-btn" data-a="fwd" title="Forward">${icon("fwd")}</button>
      <button class="icon-btn" data-a="up" title="Up">${icon("up")}</button>
      <button class="icon-btn" data-a="refresh" title="Refresh">${icon("refresh")}</button>
      <div class="ex-addr"></div>
      <label class="ex-search">${icon("search", 14)}<input placeholder="Search"></label>
    </div>
    <div class="ex-main">
      <aside class="ex-nav"></aside>
      <div class="ex-list">
        <div class="ex-row ex-headrow"><span>Name</span><span>Date modified</span><span>Type</span><span class="ex-size">Size</span></div>
        <div class="ex-rows"></div>
      </div>
    </div>
    <div class="ex-status"></div>`;
  const q = (s) => $(s, win.body);
  const nav = q(".ex-nav");
  nav.innerHTML = PLACES.map(([n, p, ic]) => `<button data-p="${p}">${icon(ic, 16)}<span>${n}</span></button>`).join("") +
    `<div class="grp">This PC</div><button data-root>${icon("drive", 16)}<span>Local Disk</span></button>`;
  nav.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; b.dataset.root != null ? go(st.sep === "\\" ? "C:\\" : "/") : go(b.dataset.p); };

  q(".ex-cmd").onclick = (e) => {
    const a = e.target.closest("button")?.dataset.a;
    if (a === "back" && st.back.length) { st.fwd.push(st.path); go(st.back.pop(), false); }
    if (a === "fwd" && st.fwd.length) { st.back.push(st.path); go(st.fwd.pop(), false); }
    if (a === "up" && st.parent) go(st.parent);
    if (a === "refresh") go(st.path, false);
  };
  const search = q(".ex-search input");
  search.oninput = () => { st.filter = search.value.toLowerCase(); renderRows(); };

  async function go(path, push = true) {
    try {
      const r = await api("/fs/list?path=" + encodeURIComponent(path));
      if (push && st.path && st.path !== r.path) { st.back.push(st.path); st.fwd = []; }
      Object.assign(st, { path: r.path, sep: r.sep, parent: r.parent, entries: r.entries, sel: null, filter: "" });
      W.home = r.home; search.value = "";

    } catch (err) {
      q(".ex-rows").innerHTML = `<div class="ex-empty">${esc(err.message)}</div>`;
    }

    q('[data-a="fwd"]').disabled = !st.fwd.length;
    q('[data-a="up"]').disabled = !st.parent;

  }

    const addr = q(".ex-addr");
    const parts = st.path.split(/[\\/]/).filter(Boolean);
    const crumbs = [];
    let acc = st.sep === "\\" ? "" : "/";
    if (st.sep === "/") crumbs.push(["/", "/"]);
    parts.forEach((p, i) => {
      acc = st.sep === "\\" ? (i === 0 ? p + "\\" : acc.replace(/\\?$/, "\\") + p) : acc.replace(/\/?$/, "/") + p;
      crumbs.push([p, acc]);
    });
    addr.innerHTML = crumbs.map(([n, p], i) => `${i ? `<span class="sep">${icon("chev", 12)}</span>` : ""}<button class="crumb" data-p="${esc(p)}">${esc(n)}</button>`).join("");
    addr.onclick = (e) => {

      inp.onkeydown = (k) => { if (k.key === "Enter") go(inp.value); if (k.key === "Escape") renderAddr(); };
      inp.onblur = () => setTimeout(renderAddr, 100);

  }

  function visible() {

      .filter((e) => (S.showHidden || !e.name.startsWith(".")) && (!st.filter || e.name.toLowerCase().includes(st.filter)))
      .sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
  }
  const full = (name) => st.path.replace(/[\\/]$/, "") + st.sep + name;

  function renderRows() {
    const rows = q(".ex-rows");
    const list = visible();
    if (!list.length) {
      rows.innerHTML = st.filter
        ? `<div class="ex-empty">No matches in this folder.<br><button class="btn primary" data-ask>${icon("wren", 13, 2)} Ask Wren to search for "${esc(search.value)}"</button></div>`
        : `<div class="ex-empty">This folder is empty.</div>`;
      const ask = $("[data-ask]", rows);
      if (ask) ask.onclick = () => { openWren(); send(`Find files matching "${search.value}" anywhere under ${st.path}`); };
    } else {
      rows.innerHTML = list.map((e) => `<div class="ex-row${st.sel === e.name ? " sel" : ""}" data-n="${esc(e.name)}">
        <span class="ex-name">${e.dir ? FOLDER_ICON : IMG_EXT.test(e.name) ? IMG_ICON : FILE_ICON}<span>${esc(e.name)}</span></span>
        <span class="ex-dim">${fmtDate(e.modified)}</span><span class="ex-dim">${fileType(e)}</span>
        <span class="ex-dim ex-size">${e.dir ? "" : fmtSize(e.size)}</span></div>`).join("");
    }
    const hidden = st.entries.length - st.entries.filter((e) => S.showHidden || !e.name.startsWith(".")).length;
    q(".ex-status").innerHTML = `<span>${list.length} item${list.length === 1 ? "" : "s"}</span>${hidden ? `<span>${hidden} hidden</span>` : ""}${st.sel ? `<span>1 item selected</span>` : ""}`;
  }
  const rowsEl = q(".ex-rows");
  const entryOf = (row) => st.entries.find((e) => e.name === row.dataset.n);
  rowsEl.onclick = (e) => { const r = e.target.closest(".ex-row"); st.sel = r ? r.dataset.n : null; renderRows(); };
  rowsEl.ondblclick = (e) => { const r = e.target.closest(".ex-row"); if (r && entryOf(r)?.dir) go(full(r.dataset.n)); };
  rowsEl.oncontextmenu = (e) => {
    e.preventDefault(); e.stopPropagation();
    const r = e.target.closest(".ex-row");
    const items = [];
    if (r) {
      const ent = entryOf(r), p = full(r.dataset.n);

    }
    openCtx(e.clientX, e.clientY, items, r ? (entryOf(r)?.dir ? "files:folder" : "files:file") : "files:here");

}

// filled shape) keeps its outline.
function analyzeIcon(img) {
  const N = 64, RIM = 4, cv = document.createElement("canvas");
  cv.width = cv.height = N;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.drawImage(img, 0, 0, N, N);
  const px = cx.getImageData(0, 0, N, N).data;
  const solid = (x, y) => x >= 0 && y >= 0 && x < N && y < N && px[(y * N + x) * 4 + 3] > 160;
  const opaque = [], rim = [], inner = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!solid(x, y)) continue;
    const i = (y * N + x) * 4;
    opaque.push(i);
    let edge = false;
    for (let d = 1; d <= RIM && !edge; d++) edge = !solid(x - d, y) || !solid(x + d, y) || !solid(x, y - d) || !solid(x, y + d);
    (edge ? rim : inner).push(i);
  }
  if (opaque.length < N * N * .04) return null;
  const rgbOf = (i) => [px[i], px[i + 1], px[i + 2]];
  const buckets = (idxs, keep) => {
    const m = new Map();
    for (const i of idxs) {
      if (keep && !keep(i)) continue;
      const k = (px[i] >> 5) << 6 | (px[i + 1] >> 5) << 3 | px[i + 2] >> 5;
      const e = m.get(k) || { n: 0, r: 0, g: 0, b: 0 };
      e.n++; e.r += px[i]; e.g += px[i + 1]; e.b += px[i + 2]; m.set(k, e);
    }
    return [...m.values()].sort((x, y) => y.n - x.n).map((e) => ({ n: e.n, c: [e.r / e.n, e.g / e.n, e.b / e.n] }));
  };
  // The background's shades: the most common rim colors, up to 85% of the rim.
  const palette = [];
  let covered = 0;
  for (const b of buckets(rim)) { if (covered >= rim.length * .85 || palette.length >= 6) break; palette.push(b); covered += b.n; }
  const out = cx.createImageData(N, N), glyph = [];
  for (const i of inner) {
    const d = Math.min(...palette.map((p) => Math.hypot(px[i] - p.c[0], px[i + 1] - p.c[1], px[i + 2] - p.c[2])));
    const w = Math.max(0, Math.min(1, (d - 55) / 45));
    out.data[i] = out.data[i + 1] = out.data[i + 2] = 255;
    out.data[i + 3] = Math.round(w * 255);
    if (w > .5) glyph.push(i);
  }
  const ratio = glyph.length / opaque.length;
  const vivid = (i) => { const [, s, l] = rgbHsl(rgbOf(i)); return s > .3 && l > .15 && l < .9; };
  let c;
  if (palette.length && ratio > .02 && ratio < .6) {
    // A symbol on a background: the background's most vivid shade is the brand color.
    c = palette.map((p) => p.c).find((x) => rgbHsl(x)[1] > .3) || buckets(glyph, vivid)[0]?.c;
  } else {
    // One shape: its outline, in its most common vivid color.
    out.data.fill(0);
    for (const i of opaque) { out.data[i] = out.data[i + 1] = out.data[i + 2] = 255; out.data[i + 3] = px[i + 3]; }
    c = buckets(opaque, vivid)[0]?.c;
  }
  cx.putImageData(out, 0, 0);
  // Cropped to the symbol, so every symbol fills its tile the same way.
  let x0 = N, y0 = N, x1 = -1, y1 = -1;
  for (let i = 3; i < out.data.length; i += 4) if (out.data[i] > 40) { const p = (i - 3) / 4, x = p % N, y = (p / N) | 0; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  if (x1 < 0) return null;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, k = 64 / Math.max(w, h), crop = document.createElement("canvas");
  crop.width = Math.max(1, Math.round(w * k)); crop.height = Math.max(1, Math.round(h * k));
  crop.getContext("2d").drawImage(cv, x0, y0, w, h, 0, 0, crop.width, crop.height);
  return { m: crop.toDataURL("image/png"), c: c && c.map(Math.round) };
}
async function makeGlyph(app) {
  const k = app.key;
  if (glyphWork.has(k)) return;
  glyphWork.add(k);
  let g = { none: true };
  try {
    const img = new Image();
    img.src = `store/icon/${k}`;
    await img.decode();
    const a = analyzeIcon(img);
    if (a) g = { m: app.has_symbolic ? "sym" : a.m, c: a.c };
  } catch {}
  GLYPHS.a[k] = g;
  store.set("wren.glyphs", GLYPHS);
  document.querySelectorAll(`[data-gk="${CSS.escape(k)}"]`).forEach((t) => { t.outerHTML = glassTile(app, t.dataset.gx || ""); });
}
const glyphVars = (cols) => (cols ? `--gc-d:${cols.d};--gc-l:${cols.l};` : "");
// A glass tile for an app from the scan ({key, name, has_icon, has_symbolic}),
// or for one of Wren's own ({tile, ic}).
function glassTile(app, cls = "", size = 24) {
  if (app.ic) return `<div class="tile gl ${cls}" style="${glyphVars(glyphColors(hexRgb(app.tile)))}">${icon(app.ic, size, 1.9)}</div>`;
  const letter = esc((app.name || "?").trim()[0]?.toUpperCase() || "?");
  const hueCols = { d: `hsl(${hue(app.name || "")} 70% 68%)`, l: `hsl(${hue(app.name || "")} 60% 38%)` };
  if (!app.has_icon) return `<div class="tile gl ${cls}" style="${glyphVars(hueCols)}"><span class="gl-l">${letter}</span></div>`;
  const g = GLYPHS.a[app.key];
  if (!g) { setTimeout(() => makeGlyph(app)); return `<div class="tile gl ${cls}" data-gk="${esc(app.key)}" data-gx="${esc(cls)}"><span class="gl-l" style="opacity:.35">${letter}</span></div>`; }
  if (g.none) return `<div class="tile gl ${cls}" style="${glyphVars(hueCols)}"><span class="gl-l">${letter}</span></div>`;
  const mask = g.m === "sym" ? `store/icon/${app.key}?symbolic=true` : g.m;
  return `<div class="tile gl ${cls}" style="${glyphVars(glyphColors(g.c))}--gm:url('${mask}')"><i class="glyph"></i></div>`;
}
const glassOn = () => S.iconStyle !== "color";

function renderDock() {
  const d = $("#dock");
  d.innerHTML = "";
  const groups = appGroups(), pinnedApps = new Set();
  const item = (cls, tile, tip, run, menu) => {
    const b = el(`<button class="dock-item ${cls}">${tile}<span class="tip glass">${esc(tip)}</span></button>`);
    b.onclick = (e) => { e.stopPropagation(); run(); };
    if (menu) b.oncontextmenu = menu;
    d.appendChild(b);
    return b;
  };
  for (const it of DOCK) {
    // Open apps that aren't pinned go after the pinned ones, before the folders.
    if (it === "sep") {
      for (const [k, g] of groups) {
        if (pinnedApps.has(k)) continue;
        const name = g.app?.name || g.wins[0].title || g.wins[0].app_id;
        const tile = glassOn() ? glassTile(g.app || { name, key: g.wins[0].app_id }) : g.app?.has_icon ? `<div class="tile app"><img src="store/icon/${g.app.key}" alt=""></div>` : `<div class="tile letter">${esc(name.slice(0, 1).toUpperCase())}</div>`;
        item(`running${g.wins.some((w) => w.current) ? " focused" : ""}`, tile, g.wins.length > 1 ? `${name} (${g.wins.length} windows)` : name, () => dockApp(g.wins), (e) => dockMenu(e, null, g.wins));
      }
      d.appendChild(el(`<div class="dock-sep"></div>`));
      continue;
    }
    const mine = [];
    for (const [k, g] of groups) if (it.appIds?.some((a) => g.wins[0].app_id.toLowerCase() === a)) { mine.push(...g.wins); pinnedApps.add(k); }
    const cls = `${wins.has(it.id) || mine.length ? "running" : ""}${mine.some((w) => w.current) ? " focused" : ""}`;
    const tile = glassOn() && it.ic && it.id !== "orb" ? glassTile(it) : `<div class="tile" style="background:${it.tile}">${it.ic ? icon(it.ic, 24, 1.9) : ""}</div>`;
    const b = item(cls, tile, it.name, mine.length ? () => dockApp(mine) : it.run,
      it.id === "orb" || it.id === "apps" || it.id === "trash" ? null : (e) => dockMenu(e, it, mine));
    if (it.id === "orb") b.id = "dock-orb";
  }
}

/* ================= App windows in the dock ================= */
// Apps' own windows (Zen, Text Editor…), from the compositor's window list. The
// service answers /windows?since=N only once something changes, so this is live
// without polling. Empty on systems that don't share a window list (Windows).
const APPWIN = { list: [], version: null };
function appGroups() {
  const groups = new Map();
  for (const w of APPWIN.list) {
    const k = w.app?.key || w.app_id.toLowerCase();
    if (!groups.has(k)) groups.set(k, { app: w.app, wins: [] });
    groups.get(k).wins.push(w);
  }
  return groups;
}
// Like Windows' taskbar: focus the app; if it's already the one you're in, minimize
// it; with several windows, step through them.
async function dockApp(ws) {
  const cur = ws.find((w) => w.current);
  const target = cur && ws.length > 1 ? ws[(ws.indexOf(cur) + 1) % ws.length] : cur || ws.find((w) => !w.minimized) || ws[0];
  try { await api(`/windows/${target.id}/${target === cur ? "minimize" : "activate"}`, {}); } catch (e) { toast(e.message); }
}
async function watchWindows() {
  for (;;) {
    try {
      const r = await api(`/windows${APPWIN.version == null ? "" : `?since=${APPWIN.version}`}`);
      const was = JSON.stringify(APPWIN.list);
      APPWIN.version = r.version; APPWIN.list = r.windows;
      if (JSON.stringify(r.windows) !== was) renderDock();
    } catch { await new Promise((ok) => setTimeout(ok, 5000)); }
  }
}

/* ================= Desktop greeting & keys ================= */
function greet() {
  const h = new Date().getHours();
  const part = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const n = S.name || (W.home ? W.home.split(/[\\/]/).pop() : "");
  $("#amb-greet").textContent = n ? `${part}, ${n}.` : `${part}.`;
}
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.altKey && e.code === "KeyT") { e.preventDefault(); openTerminal(); return; }
  if (e.target.closest?.(".xterm")) {
    if (e.ctrlKey && e.shiftKey && e.code === "KeyT") { e.preventDefault(); const w = wins.get("terminal"); if (w) addTermTab(w); }
    return;
  }
  if (e.ctrlKey && e.code === "Space") { e.preventDefault(); toggleWren(); return; }
  if (e.ctrlKey && !e.shiftKey && e.code === "KeyK") { e.preventDefault(); toggleLauncher(); return; }
  if ($("#launcher").classList.contains("open") && launcherKey(e)) return;
  if (e.ctrlKey && e.shiftKey && e.code === "KeyV") { e.preventDefault(); $("#clip-pop").hidden ? openClip() : closeClip(); return; }
  if (e.key === "Escape") { closeCtx(); closeClip(); closePorts(); if (W.open) closeWren(); return; }
  const onDesktop = e.target === document.body && !focused && !W.open;
  if (S.wrenPlace === "desktop" && onDesktop && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openWren(e.key); }
});

/* ================= Boot ================= */
applySettings();
renderDock();
watchWindows();
refreshStats();
renderTabs();
updateStatus();
refreshPorts();
refreshClip();
refreshQS(false);
loadApps();
setTimeout(noticeUpdates, 20000);
setInterval(noticeUpdates, 30 * 60 * 1000);
if (location.hash.startsWith("#open=apps")) setTimeout(() => {
  openLauncher();
  const q = new URLSearchParams(location.hash.slice(1)).get("q");
  if (q) { $("#ln-q").value = q; renderLauncher(); }
}, 300);
// #open=clip / #open=ports opens that dropdown on load (handy for screenshots and docs).
if (location.hash === "#open=clip") setTimeout(openClip, 300);
if (location.hash === "#open=ports") setTimeout(openPorts, 300);
if (location.hash === "#open=projects") setTimeout(() => openProjPick(null), 300);
// #open=qs opens quick settings; #open=settings&page=network a Settings page.
if (location.hash === "#open=qs") setTimeout(openQS, 300);
if (location.hash.startsWith("#open=store")) setTimeout(() => openStore(new URLSearchParams(location.hash.slice(1)).get("view") || undefined), 300);
if (location.hash.startsWith("#open=terminal")) setTimeout(() => openTerminal(new URLSearchParams(location.hash.slice(1)).get("cwd") || undefined), 300);
if (location.hash === "#open=lock") setTimeout(lockNow, 300);
if (location.hash === "#open=phone-qr") setTimeout(async () => { await loadPhone(); try { PHONE.qr = await api("/phone/pair", { ip: PHONE.st.addresses[0].ip }); } catch {} openSettings("phone"); }, 300);
if (location.hash.startsWith("#open=settings")) setTimeout(() => openSettings(new URLSearchParams(location.hash.slice(1)).get("page")), 300);
// The loading splash leaves once the page is ready (never later than 4 s).
function hideBoot() { const b = document.getElementById("boot"); if (!b || b.classList.contains("gone")) return; b.classList.add("gone"); setTimeout(() => b.remove(), 500); }
setTimeout(hideBoot, 4000);
loadRecent();
fetch("/lock").then((r) => r.json()).then((st) => { if (st.locked) showLock(); }).catch(() => {});
syncSessions().then(async () => {
  try { W.home = (await api("/fs/list?path=~")).home; } catch {}
  greet();
  document.fonts.ready.then(hideBoot);
  // First run: the setup screens (#open=setup shows them again).
  if (location.hash === "#open=setup") openSetup();
  else api("/setup").then((r) => { if (!r.done) openSetup(); }).catch(() => {});
  // #open=wren&tab=2 opens the panel on that tab (screenshots and docs).
  const tab = +new URLSearchParams(location.hash.slice(1)).get("tab");
  if (location.hash.startsWith("#open=wren")) { if (SESS.has(tab)) activate(tab); openWren(); }
});
